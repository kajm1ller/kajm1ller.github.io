<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kaj Simulator</title>
    <style>
        body { 
            margin: 0; 
            overflow: hidden;
        }
        #loading {
            position: absolute;
            top: 25%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: rgb(255, 255, 255);
            background: rgba(0,0,0,0.8);
            padding: 20px 40px;
            border-radius: 10px;
            font-family: Arial, sans-serif;
            font-size: 24px;
            z-index: 200;
        }
        canvas {
            display: block;
        }
        #coords {
            position: absolute;
            top: 10px;
            right: 10px;
            color: white;
            background: rgba(0,0,0,0.5);
            padding: 10px;
            border-radius: 5px;
            font-family: monospace;
            font-size: 14px;
            z-index: 100;
        }
        #name-input {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%,-50%);
            color: white;
            background: rgba(0,0,0,0.9);
            padding: 30px 50px;
            border-radius: 10px;
            font-family: Arial, sans-serif;
            font-size: 20px;
            z-index: 200;
            text-align: center;
        }
        #name-input input {
            padding: 10px;
            font-size: 18px;
            border: none;
            border-radius: 5px;
            width: 200px;
            text-align: center;
        }
        #name-input button {
            padding: 12px 30px;
            font-size: 18px;
            cursor: pointer;
            border: none;
            border-radius: 5px;
            background: #000;
            color: white;
        }
        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%,-50%);
            z-index: 100;
            pointer-events: none;
            display: none;
        }
        #crosshair .h {
            position: absolute;
            width: 20px;
            height: 2px;
            background: rgba(255,255,255,0.8);
            left: -10px;
            top: -1px;
        }
        #crosshair .v {
            position: absolute;
            width: 2px;
            height: 20px;
            background: rgba(255,255,255,0.8);
            left: -1px;
            top: -10px;
        }
        #spray-hud {
            display: none;
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            background: rgba(0,0,0,0.6);
            padding: 10px 20px;
            border-radius: 8px;
            font-family: Arial, sans-serif;
            font-size: 15px;
            z-index: 100;
            pointer-events: none;
            text-align: center;
        }
        #color-picker {
            display: none;
            position: absolute;
            bottom: 60px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
            background: rgba(0,0,0,0.7);
            padding: 8px 12px;
            border-radius: 8px;
            gap: 6px;
            display: none;
            flex-wrap: wrap;
            justify-content: center;
            max-width: 280px;
        }
        .color-swatch {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            border: 2px solid rgba(255,255,255,0.4);
            cursor: pointer;
            transition: transform 0.1s;
        }
        .color-swatch:hover {
            transform: scale(1.2);
        }
        .color-swatch.active {
            border-color: white;
            transform: scale(1.25);
        }
        #dev-hud {
            display: none;
            position: absolute;
            top: 50px;
            left: 50%;
            transform: translateX(-50%);
            color: #0f0;
            background: rgba(0,0,0,0.8);
            padding: 8px 18px;
            border-radius: 6px;
            font-family: monospace;
            font-size: 14px;
            z-index: 200;
            pointer-events: none;
            white-space: pre;
        }
        /* Image upload button */
        #image-upload-btn {
            display: none;
            position: absolute;
            bottom: 70px;
            right: 20px;
            z-index: 100;
            background: rgba(0,0,0,0.7);
            color: white;
            border: 2px solid rgba(255,255,255,0.4);
            padding: 8px 16px;
            border-radius: 8px;
            font-family: Arial, sans-serif;
            font-size: 14px;
            cursor: pointer;
        }
        #image-upload-btn:hover { background: rgba(0,0,0,0.9); }
        #image-upload-btn.has-image { border-color: #4f4; }
        #mode-indicator {
            display: none;
            position: absolute;
            bottom: 100px;
            right: 20px;
            z-index: 100;
            background: rgba(0,0,0,0.7);
            color: white;
            padding: 6px 14px;
            border-radius: 8px;
            font-family: Arial, sans-serif;
            font-size: 13px;
            pointer-events: none;
        }
        /* Mobile controls */
        #mobile-controls {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 90;
            pointer-events: none;
        }
        #mobile-joystick {
            position: absolute;
            bottom: 30px;
            left: 30px;
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: rgba(255,255,255,0.15);
            border: 2px solid rgba(255,255,255,0.3);
            pointer-events: auto;
            touch-action: none;
        }
        #mobile-joystick-thumb {
            position: absolute;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: rgba(255,255,255,0.5);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
        }
        #mobile-look {
            position: absolute;
            top: 0;
            right: 0;
            width: 55%;
            height: 100%;
            pointer-events: auto;
            touch-action: none;
        }
        #mobile-spray-btn {
            position: absolute;
            bottom: 30px;
            right: 30px;
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: rgba(255,60,60,0.5);
            border: 2px solid rgba(255,255,255,0.4);
            pointer-events: auto;
            touch-action: none;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
            font-size: 11px;
            color: white;
            text-transform: uppercase;
        }
        #mobile-mode-btn {
            position: absolute;
            bottom: 110px;
            right: 35px;
            width: 60px;
            height: 36px;
            border-radius: 8px;
            background: rgba(0,0,0,0.6);
            border: 1px solid rgba(255,255,255,0.3);
            pointer-events: auto;
            touch-action: none;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
            font-size: 11px;
            color: white;
        }
        #mobile-upload-btn {
            position: absolute;
            bottom: 155px;
            right: 35px;
            width: 60px;
            height: 36px;
            border-radius: 8px;
            background: rgba(0,0,0,0.6);
            border: 1px solid rgba(255,255,255,0.3);
            pointer-events: auto;
            touch-action: none;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
            font-size: 11px;
            color: white;
        }
        #mobile-color-btn {
            position: absolute;
            bottom: 200px;
            right: 35px;
            width: 60px;
            height: 36px;
            border-radius: 8px;
            background: rgba(0,0,0,0.6);
            border: 1px solid rgba(255,255,255,0.3);
            pointer-events: auto;
            touch-action: none;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
            font-size: 11px;
            color: white;
        }
    </style>
</head>
<body>
    <div id="coords">X: 0.00<br>Y: 0.00<br>Z: 0.00</div>
    <div id="name-input">
        <div style="margin-bottom:15px;">NAME</div>
        <input type="text" id="player-name" maxlength="20" placeholder="Your Name">
        <br><br>
        <button id="join-btn">Join Game</button>
    </div>
    <div id="loading">Loading map...</div>
    <div id="crosshair"><div class="h"></div><div class="v"></div></div>
    <div id="spray-hud">Spray Can | Scroll to resize | C colors | V mode</div>
    <div id="color-picker"></div>
    <div id="dev-hud">DEV FLY MODE
WASD + Space/Shift | Ctrl = Sprint | F12 = Exit</div>
    <input type="file" id="image-file-input" accept="image/*" style="display:none">
    <button id="image-upload-btn">📷 Upload Image</button>
    <div id="mode-indicator">Mode: Spray</div>
    <div id="mobile-controls">
        <div id="mobile-joystick"><div id="mobile-joystick-thumb"></div></div>
        <div id="mobile-look"></div>
        <div id="mobile-spray-btn">Spray</div>
        <div id="mobile-mode-btn">V Mode</div>
        <div id="mobile-upload-btn">📷 Img</div>
        <div id="mobile-color-btn">C Color</div>
    </div>
    
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
    
    <script type="module">
        import * as THREE from 'three';

        // ============ SCENE SETUP ============
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xa8d8f0);
        scene.fog = new THREE.Fog(0xa8d8f0, 80, 250);
        
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 300);
        
        // Player starting position
        const playerStartPos = new THREE.Vector3(0, 0, 0);
        const myPosition = new THREE.Vector3();
        
        // Collision detection
        const collisionMeshes = [];
        const playerRadius = 0.4;
        
        // ============ RENDERER ============
        const renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: 'high-performance' });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.4;
        renderer.outputColorSpace = THREE.SRGBColorSpace;
        document.body.appendChild(renderer.domElement);
        
        // ============ LIGHTING (brighter, better shading) ============
        // Hemisphere light for natural sky/ground color bounce
        const hemiLight = new THREE.HemisphereLight(0x87ceeb, 0x556b2f, 0.8);
        hemiLight.position.set(0, 200, 0);
        scene.add(hemiLight);

        // Bright ambient fill
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
        scene.add(ambientLight);
        
        // Main sun light (no shadows for performance)
        const sunLight = new THREE.DirectionalLight(0xfff5e6, 1.8);
        sunLight.position.set(80, 180, 60);
        scene.add(sunLight);

        // Secondary fill light from opposite direction
        const fillLight = new THREE.DirectionalLight(0xc4deff, 0.5);
        fillLight.position.set(-60, 100, -80);
        scene.add(fillLight);
        
        // Ground plane
        const groundGeometry = new THREE.PlaneGeometry(600, 600, 1, 1);
        const groundMaterial = new THREE.MeshLambertMaterial({ color: 0x5a8f2a });
        const ground = new THREE.Mesh(groundGeometry, groundMaterial);
        ground.rotation.x = -Math.PI / 2;
        ground.position.y = 0;
        ground.name = 'ground';
        scene.add(ground);
        
        // ============ FIRST-PERSON CONTROLS ============
        let fpCameraYaw = 0;
        let fpCameraPitch = 0;
        const fpMouseSensitivity = 0.002;
        const fpMaxPitch = Math.PI / 2 - 0.1;
        const fpMoveSpeed = 0.12;
        const fpKeys = { w: false, a: false, s: false, d: false };
        let gameStarted = false;
        
        // ============ SPRAY CAN SYSTEM ============
        const sprayColors = [
            0xff0000, 0xff6600, 0xffff00, 0x00ff00, 0x00ccff,
            0x0044ff, 0x9900ff, 0xff00cc, 0xffffff, 0x000000,
            0xff4444, 0x44ff44, 0x4488ff, 0xffaa00, 0x888888
        ];
        let currentSprayColor = 0xff0000;
        let spraySize = 0.4;
        const sprayMinSize = 0.1;
        const sprayMaxSize = 2.0;
        const sprayDecals = [];
        const maxDecals = 500;
        let isSpraying = false;
        let lastSprayTime = 0;
        const sprayRate = 50; // ms between spray marks
        const sprayRaycaster = new THREE.Raycaster();
        // Shared geometry for all spray decals (reused, not recreated)
        const sharedDecalGeo = new THREE.PlaneGeometry(1, 1);
        // Cache of sprayable meshes (built after map load)
        let sprayTargetMeshes = [];
        
        // Pre-create spray texture (soft circle)
        function createSprayTexture() {
            const size = 64;
            const canvas = document.createElement('canvas');
            canvas.width = size;
            canvas.height = size;
            const ctx = canvas.getContext('2d');
            const gradient = ctx.createRadialGradient(size/2, size/2, 0, size/2, size/2, size/2);
            gradient.addColorStop(0, 'rgba(255,255,255,1)');
            gradient.addColorStop(0.5, 'rgba(255,255,255,0.8)');
            gradient.addColorStop(0.8, 'rgba(255,255,255,0.2)');
            gradient.addColorStop(1, 'rgba(255,255,255,0)');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, size, size);
            const texture = new THREE.CanvasTexture(canvas);
            return texture;
        }
        const sprayTexture = createSprayTexture();
        
        // ============ IMAGE UPLOAD & PASTE SYSTEM ============
        let uploadedTexture = null;
        let imageMode = false; // false = spray, true = image paste
        const imageDecals = [];
        const maxImageDecals = 200;
        let imageSize = 1.5;
        const imageMinSize = 0.2;
        const imageMaxSize = 5.0;
        const imageFileInput = document.getElementById('image-file-input');
        const imageUploadBtn = document.getElementById('image-upload-btn');
        const modeIndicator = document.getElementById('mode-indicator');
        
        imageUploadBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            imageFileInput.click();
        });
        
        imageFileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            if (!file.type.startsWith('image/')) return;
            const reader = new FileReader();
            reader.onload = (ev) => {
                const img = new Image();
                img.onload = () => {
                    if (uploadedTexture) uploadedTexture.dispose();
                    uploadedTexture = new THREE.Texture(img);
                    uploadedTexture.needsUpdate = true;
                    uploadedTexture.colorSpace = THREE.SRGBColorSpace;
                    imageUploadBtn.classList.add('has-image');
                    imageUploadBtn.textContent = '📷 ' + file.name.substring(0, 12);
                    // Auto-switch to image mode
                    imageMode = true;
                    updateModeIndicator();
                };
                img.src = ev.target.result;
            };
            reader.readAsDataURL(file);
            imageFileInput.value = '';
        });
        
        function updateModeIndicator() {
            modeIndicator.textContent = imageMode ? 'Mode: Image Paste (V)' : 'Mode: Spray (V)';
        }
        
        function toggleMode() {
            imageMode = !imageMode;
            updateModeIndicator();
        }
        
        function pasteImageAtTarget() {
            if (!uploadedTexture) return;
            
            sprayRaycaster.setFromCamera(new THREE.Vector2(0, 0), camera);
            sprayRaycaster.far = 20;
            const intersects = sprayRaycaster.intersectObjects(sprayTargetMeshes, false);
            if (intersects.length === 0) return;
            
            const hit = intersects[0];
            if (!hit.face) return;
            
            const normal = hit.face.normal.clone();
            if (hit.object.matrixWorld) {
                const normalMatrix = new THREE.Matrix3().getNormalMatrix(hit.object.matrixWorld);
                normal.applyMatrix3(normalMatrix).normalize();
            }
            
            // Compute aspect ratio from uploaded image
            const img = uploadedTexture.image;
            const aspect = img.width / img.height;
            const w = imageSize * (aspect >= 1 ? 1 : aspect);
            const h = imageSize * (aspect >= 1 ? 1 / aspect : 1);
            
            const decalMat = new THREE.MeshBasicMaterial({
                map: uploadedTexture,
                transparent: true,
                depthWrite: false,
                side: THREE.DoubleSide
            });
            
            const decalPos = hit.point.clone().add(normal.clone().multiplyScalar(0.015));
            const decal = new THREE.Mesh(sharedDecalGeo, decalMat);
            decal.scale.set(w, h, 1);
            decal.position.copy(decalPos);
            decal.lookAt(decalPos.clone().add(normal));
            
            scene.add(decal);
            imageDecals.push(decal);
            
            if (imageDecals.length > maxImageDecals) {
                const old = imageDecals.shift();
                scene.remove(old);
                old.material.dispose();
            }
        }
        
        function sprayAtTarget() {
            const now = Date.now();
            if (now - lastSprayTime < sprayRate) return;
            lastSprayTime = now;
            
            // Use easeOutCubic for smooth deceleration
            const easeT = 1 - Math.pow(1 - t, 3);
            
            fpCameraYaw = cameraPanStartYaw + (cameraPanTargetYaw - cameraPanStartYaw) * easeT;
            fpCameraPitch = cameraPanStartPitch + (cameraPanTargetPitch - cameraPanStartPitch) * easeT;
            
            if (t >= 1.0) {
                cameraPanActive = false;
                // Normalize final yaw angle
                while (fpCameraYaw > Math.PI) fpCameraYaw -= 2 * Math.PI;
                while (fpCameraYaw < -Math.PI) fpCameraYaw += 2 * Math.PI;
            }
        }

        function enterHouse(defeatedAlready, isKajHouse = false) {
            if (inHouse || houseEntryCooldown > 0) return;
            labelRenderer.domElement.style.display = 'none';
            inHouse = true;
            houseEntryCooldown = 120;
            lastOutsidePosition.copy(myPosition);
            currentHouseIsKaj = isKajHouse;

            // Reset and build a fresh interior
            createHouseInterior(isKajHouse);

            // Teleport inside
            myPosition.set(0, 0, 3.5);
            isFirstPersonMode = true;
            if (localPlayerMesh) localPlayerMesh.visible = false;
            
            
            // Set initial camera angle and start pan animation to NPC
            fpCameraYaw = Math.PI;
            fpCameraPitch = 0;
            
            // Pan camera to look at NPC (if not Kaj's house)
            if (!isKajHouse && houseNPC) {
                // Calculate angle to NPC from player position
                const toNpc = new THREE.Vector3().subVectors(houseNPC.position, myPosition);
                const targetYaw = Math.atan2(-toNpc.x, -toNpc.z);
                const distance = Math.sqrt(toNpc.x * toNpc.x + toNpc.z * toNpc.z);
                const targetPitch = Math.atan2(toNpc.y + 0.7, distance); // +0.7 to aim at NPC head height
                startCameraPan(targetYaw, targetPitch);
            }

            // Show UI
            document.getElementById('crosshair').style.display = isMobile ? 'none' : 'block';
            document.getElementById('weapon-display').style.display = 'block';
            updateWeaponDisplay();

            // Show dialog
            houseCombatActive = false;
            houseDialogEl.style.display = 'none';
            corpseDialogEl.style.display = 'none';
            corpseLootBtn.disabled = false;
            corpseEatBtn.disabled = false;
            corpseRemoroBtn.disabled = false;
            if (isKajHouse) {
                houseAttackBtn.disabled = true;
                updateExitIndicator();
                updateBedIndicator();
                return;
            }
            if (defeatedAlready) {
                setHouseNpcCorpse();
                corpseDialogTextEl.textContent = 'You\'ve already killed this person. You can\'t kill them again, you fucking lunatic.';
                corpseDialogEl.style.display = 'block';
                houseAttackBtn.disabled = true;
            } else {
                const line = houseDialogLines[Math.floor(Math.random() * houseDialogLines.length)];
                houseDialogTextEl.textContent = line;
                houseDialogEl.style.display = 'block';
                houseAttackBtn.disabled = false;
            }
            updateExitIndicator();
        }

        function exitHouse() {
            labelRenderer.domElement.style.display = 'block';
            inHouse = false;
            houseCombatActive = false;
            houseScene = null;
            houseFurniture = [];
            houseNPC = null;
            houseBounds = null;
            houseExitZone = null;
            kajHouseBedZone = null;
            myPosition.copy(lastOutsidePosition);
            if (localPlayerMesh) localPlayerMesh.visible = true;
            isFirstPersonMode = false;
            targetPosition = null;
            if (!isMobile) document.exitPointerLock();
            houseDialogEl.style.display = 'none';
            combatUiEl.style.display = 'none';
            corpseDialogEl.style.display = 'none';
            document.getElementById('crosshair').style.display = 'none';
            document.getElementById('weapon-display').style.display = 'none';
            exitIndicatorEl.style.display = 'none';
            bedIndicatorEl.style.display = 'none';
            houseEntryCooldown = 240;
            currentHouseId = null;
            currentHouseIsKaj = false;
        }

        function checkHouseEntry() {
            if (inHouse || houseEntryCooldown > 0 || isFirstPersonMode) return;
            const entryDistance = 2.2;
            for (const mesh of collisionMeshes) {
                const box = mesh.userData.worldBox;
                const height = mesh.userData.height || 0;
                if (!box || height < 2.5) continue;
                if (
                    myPosition.x > box.min.x - entryDistance && myPosition.x < box.max.x + entryDistance &&
                    myPosition.z > box.min.z - entryDistance && myPosition.z < box.max.z + entryDistance
                ) {
                    const houseId = getHouseIdFromBox(box);
                    currentHouseId = houseId;
                    
                    enterHouse(houseDefeated.has(houseId), houseId === kajHouseId);
                    break;
                }
            }
        }

        function updateHouseMovement() {
            if (!isFirstPersonMode) return;

            if (houseCombatActive) {
                camera.position.copy(myPosition).add(new THREE.Vector3(0, 1.7, 0));
                camera.rotation.order = 'YXZ';
                camera.rotation.y = fpCameraYaw;
                camera.rotation.x = fpCameraPitch;
                camera.rotation.z = 0;
                updateExitIndicator();
                updateBedIndicator();
                return;
            }

            const forward = new THREE.Vector3(
                -Math.sin(fpCameraYaw),
                0,
                -Math.cos(fpCameraYaw)
            );
            const right = new THREE.Vector3(
                Math.cos(fpCameraYaw),
                0,
                -Math.sin(fpCameraYaw)
            );

            const newPos = myPosition.clone();
            
            // Mobile joystick drives first-person movement inside houses
            if (isMobile && joystickState.active && (Math.abs(joystickState.dx) > 0.1 || Math.abs(joystickState.dy) > 0.1)) {
                // Joystick maps relative to camera facing direction
                newPos.add(forward.clone().multiplyScalar(-joystickState.dy * fpMoveSpeed * 1.5));
                newPos.add(right.clone().multiplyScalar(joystickState.dx * fpMoveSpeed * 1.5));
            } else {
                if (fpKeys.w) newPos.add(forward.clone().multiplyScalar(fpMoveSpeed));
                if (fpKeys.s) newPos.add(forward.clone().multiplyScalar(-fpMoveSpeed));
                if (fpKeys.a) newPos.add(right.clone().multiplyScalar(-fpMoveSpeed));
                if (fpKeys.d) newPos.add(right.clone().multiplyScalar(fpMoveSpeed));
            }

            if (!checkHouseCollision(newPos)) {
                myPosition.copy(newPos);
            }

            camera.position.copy(myPosition).add(new THREE.Vector3(0, 1.7, 0));
            camera.rotation.order = 'YXZ';
            camera.rotation.y = fpCameraYaw;
            camera.rotation.x = fpCameraPitch;
            camera.rotation.z = 0;

            updateExitIndicator();
            updateBedIndicator();
            if (isNearExit() && houseDialogEl.style.display !== 'block' && corpseDialogEl.style.display !== 'block') {
                exitHouse();
            }
        }

        function logCombat(text) {
            const line = document.createElement('div');
            line.textContent = text;
            combatLogEl.appendChild(line);
            combatLogEl.scrollTop = combatLogEl.scrollHeight;
        }

        function playCombatAttackSound(isPlayer) {
            if (isPlayer) {
                const weapon = weapons[currentWeaponIndex];
                if (!weapon.explosive) {
                    if (weapon.name === 'Pistol') {
                        playSound(pistolFireSound);
                    } else if (weapon.name === 'Rifle' || weapon.name === 'Shotgun') {
                        playSound(smgFireSound);
                    }
                } else {
                    playSound(explosionSound);
                }
            } else {
                playSound(smgFireSound);
            }
        }

        function animateNpcHit() {
            if (!houseNPC) return;
            const start = performance.now();
            const duration = 140;
            const originalPos = houseNPC.position.clone();
            const flashMeshes = [];
            houseNPC.traverse((child) => {
                if (child.isMesh) {
                    flashMeshes.push({ mesh: child, color: child.material.color.getHex() });
                    child.material.color.setHex(0xff6666);
                }
            });

            const animate = () => {
                const t = (performance.now() - start) / duration;
                if (t < 1) {
                    houseNPC.position.x = originalPos.x + (Math.random() - 0.5) * 0.08;
                    houseNPC.position.z = originalPos.z + (Math.random() - 0.5) * 0.08;
                    requestAnimationFrame(animate);
                } else {
                    houseNPC.position.copy(originalPos);
                    flashMeshes.forEach((item) => item.mesh.material.color.setHex(item.color));
                }
            };
            animate();
        }

        function rollDamage(min, max) {
            return Math.floor(randomRange(min, max + 1));
        }

        function enemyAttack() {
            const dmg = rollDamage(combatState.enemy.atkMin, combatState.enemy.atkMax);
            const finalDmg = playerDefending ? Math.floor(dmg * 0.5) : dmg;
            let v = Math.floor(Math.random() * 2);
            if(v == 1){
                combatState.player.hp = Math.max(0, combatState.player.hp - finalDmg);
                playerDefending = false;
                flashHurt();
                logCombat(`Owner hits you for ${finalDmg}.`);
                updateCombatUI();
            }
            else{
                combatState.remoro.hp = Math.max(0, combatState.remoro.hp - finalDmg);
                logCombat(`Owner hits remoro for ${finalDmg}.`);
                updateCombatUI();
            }
            
            
            if (combatState.player.hp <= 0) {
                triggerPlayerDeath('combat');
            }
        }

        function remoroAttack() {
            const dmg = rollDamage(combatState.remoro.atkMin, combatState.remoro.atkMax);
            combatState.enemy.hp = Math.max(0, combatState.enemy.hp - dmg);
            playCombatAttackSound(false);
            animateNpcHit();
            logCombat(`Remoro hits Owner for ${dmg}.`);
            updateCombatUI();
        }

        function playerAttack() {
            const dmg = rollDamage(combatState.player.atkMin, combatState.player.atkMax);
            combatState.enemy.hp = Math.max(0, combatState.enemy.hp - dmg);
            playCombatAttackSound(true);
            animateNpcHit();
            logCombat(`You hit Owner for ${dmg}.`);
            updateCombatUI();
        }

        function handlePlayerAction(action) {
            if (!houseCombatActive) return;
            if (combatActionsDisabled) return;
            if (combatState.player.hp <= 0 || combatState.enemy.hp <= 0) return;

            combatActionsDisabled = true;
            combatAttackBtn.disabled = true;
            combatTalkBtn.disabled = true;
            combatDefendBtn.disabled = true;
            combatFleeBtn.disabled = true;

            if (action === 'attack') {
                playerAttack();
            } else if (action === 'talk') {
                const line = combatTalkLines[Math.floor(Math.random() * combatTalkLines.length)];
                logCombat(`You: ${line}`);
            } else if (action === 'defend') {
                playerDefending = true;
                logCombat('You brace for impact.');
            } else if (action === 'flee') {
                logCombat('You flee the house.');
                endCombat(false);
                return;
            }

            if (combatState.enemy.hp <= 0) {
                endCombat(true);
                return;
            }

            setTimeout(() => {
                remoroAttack();
                if (combatState.enemy.hp <= 0) {
                    endCombat(true);
                    return;
                }

                setTimeout(() => {
                    enemyAttack();
                    if (combatState.player.hp <= 0) return;
                    if (houseCombatActive) {
                        combatActionsDisabled = false;
                        combatAttackBtn.disabled = false;
                        combatTalkBtn.disabled = false;
                        combatDefendBtn.disabled = false;
                        combatFleeBtn.disabled = false;
                    }
                }, 450);
            }, 350);
        }

        function createSprayCanViewmodel() {
            const group = new THREE.Group();
            
            // Can body
            const canGeo = new THREE.CylinderGeometry(0.03, 0.03, 0.16, 12);
            const canMat = new THREE.MeshStandardMaterial({ color: 0xcc2222, roughness: 0.3, metalness: 0.7 });
            const can = new THREE.Mesh(canGeo, canMat);
            group.add(can);
            
            // Can top
            const topGeo = new THREE.CylinderGeometry(0.02, 0.03, 0.02, 12);
            const topMat = new THREE.MeshStandardMaterial({ color: 0x888888, roughness: 0.2, metalness: 0.9 });
            const top = new THREE.Mesh(topGeo, topMat);
            top.position.y = 0.09;
            group.add(top);
            
            // Nozzle
            const nozzleGeo = new THREE.CylinderGeometry(0.006, 0.008, 0.03, 8);
            const nozzleMat = new THREE.MeshStandardMaterial({ color: 0x333333, roughness: 0.5, metalness: 0.5 });
            const nozzle = new THREE.Mesh(nozzleGeo, nozzleMat);
            nozzle.position.y = 0.115;
            group.add(nozzle);
            
            // Label band
            const labelGeo = new THREE.CylinderGeometry(0.031, 0.031, 0.06, 12);
            const labelMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.8, metalness: 0 });
            const label = new THREE.Mesh(labelGeo, labelMat);
            label.position.y = -0.01;
            group.add(label);
            
            // Hand holding the can
            const skinColor = 0xffcc99;
            const skinMat = new THREE.MeshLambertMaterial({ color: skinColor });
            
            // Fingers wrapped around can
            const fingerGeo = new THREE.BoxGeometry(0.015, 0.04, 0.06);
            for (let i = 0; i < 4; i++) {
                const finger = new THREE.Mesh(fingerGeo, skinMat);
                const angle = (i / 4) * Math.PI - Math.PI * 0.3;
                finger.position.set(Math.cos(angle) * 0.04, -0.02 + i * 0.015, Math.sin(angle) * 0.04);
                finger.rotation.y = -angle;
                group.add(finger);
            }
            
            // Thumb
            const thumbGeo = new THREE.BoxGeometry(0.015, 0.05, 0.02);
            const thumb = new THREE.Mesh(thumbGeo, skinMat);
            thumb.position.set(-0.04, 0.05, 0);
            group.add(thumb);
            
            // Position in view
            group.position.set(0.2, -0.22, -0.38);
            group.rotation.x = -0.1;
            group.rotation.z = 0.15;
            
            return group;
        }
        
        // Spray particles in viewmodel
        const vmSprayParticles = [];
        
        function updateViewmodel() {
            if (!viewmodelScene || !viewmodelSprayCan) return;
            
            const isMoving = fpKeys.w || fpKeys.a || fpKeys.s || fpKeys.d;
            if (isMoving) viewmodelBobTime += 0.12;
            
            const bobX = Math.sin(viewmodelBobTime) * 0.006;
            const bobY = Math.abs(Math.cos(viewmodelBobTime)) * 0.005;
            
            viewmodelSprayCan.position.x = 0.2 + bobX;
            viewmodelSprayCan.position.y = -0.22 + bobY;
            
            // Spray animation - tilt can forward when spraying
            if (isSpraying) {
                viewmodelSprayCan.rotation.x = THREE.MathUtils.lerp(viewmodelSprayCan.rotation.x, -0.4, 0.2);
                
                // Add spray particles from nozzle
                sprayParticleTime += 16;
                if (sprayParticleTime > 40) {
                    sprayParticleTime = 0;
                    const particleGeo = new THREE.SphereGeometry(0.004, 4, 4);
                    const particleMat = new THREE.MeshBasicMaterial({ 
                        color: currentSprayColor, 
                        transparent: true, 
                        opacity: 0.7 
                    });
                    const particle = new THREE.Mesh(particleGeo, particleMat);
                    particle.position.set(
                        viewmodelSprayCan.position.x + (Math.random() - 0.5) * 0.02,
                        viewmodelSprayCan.position.y + 0.12,
                        viewmodelSprayCan.position.z - 0.05
                    );
                    particle.userData.velocity = new THREE.Vector3(
                        (Math.random() - 0.5) * 0.003,
                        0.002,
                        -0.015
                    );
                    particle.userData.life = 0;
                    viewmodelScene.add(particle);
                    vmSprayParticles.push(particle);
                }
            } else {
                viewmodelSprayCan.rotation.x = THREE.MathUtils.lerp(viewmodelSprayCan.rotation.x, -0.1, 0.15);
            }
            
            // Update particles
            for (let i = vmSprayParticles.length - 1; i >= 0; i--) {
                const p = vmSprayParticles[i];
                p.position.add(p.userData.velocity);
                p.userData.life++;
                p.material.opacity -= 0.06;
                if (p.material.opacity <= 0 || p.userData.life > 15) {
                    viewmodelScene.remove(p);
                    p.geometry.dispose();
                    p.material.dispose();
                    vmSprayParticles.splice(i, 1);
                }
            }
        }

        // ============ COLLISION (fast AABB check) ============
        const _playerBox = new THREE.Box3();
        const _playerHalfSize = new THREE.Vector3(playerRadius, 0.9, playerRadius);
        
        function checkCollision(newPosition) {
            if (collisionMeshes.length === 0) return false;
            
            // Build player AABB centered on newPosition
            _playerBox.min.set(
                newPosition.x - playerRadius,
                newPosition.y + 0.1,
                newPosition.z - playerRadius
            );
            _playerBox.max.set(
                newPosition.x + playerRadius,
                newPosition.y + 1.8,
                newPosition.z + playerRadius
            );
            
            for (let i = 0, len = collisionMeshes.length; i < len; i++) {
                const box = collisionMeshes[i].userData.worldBox;
                if (box && _playerBox.intersectsBox(box)) return true;
            }
            return false;
        }
        
        // ============ DEV FLY MODE ============
        let devMode = false;
        const devFlySpeed = 1.5;
        const devFlySprintSpeed = 5.0;
        const devFlyKeys = { w: false, a: false, s: false, d: false, space: false, shift: false, sprint: false };
        const devCamPos = new THREE.Vector3(0, 50, 0);
        
        function updateDevFlyCamera() {
            const speed = devFlyKeys.sprint ? devFlySprintSpeed : devFlySpeed;
            const forward = new THREE.Vector3(
                -Math.sin(fpCameraYaw) * Math.cos(fpCameraPitch),
                Math.sin(fpCameraPitch),
                -Math.cos(fpCameraYaw) * Math.cos(fpCameraPitch)
            );
            const right = new THREE.Vector3(Math.cos(fpCameraYaw), 0, -Math.sin(fpCameraYaw));
            
            if (devFlyKeys.w) devCamPos.add(forward.clone().multiplyScalar(speed));
            if (devFlyKeys.s) devCamPos.add(forward.clone().multiplyScalar(-speed));
            if (devFlyKeys.a) devCamPos.add(right.clone().multiplyScalar(-speed));
            if (devFlyKeys.d) devCamPos.add(right.clone().multiplyScalar(speed));
            if (devFlyKeys.space) devCamPos.y += speed;
            if (devFlyKeys.shift) devCamPos.y -= speed;
            
            camera.position.copy(devCamPos);
            camera.rotation.order = 'YXZ';
            camera.rotation.y = fpCameraYaw;
            camera.rotation.x = fpCameraPitch;
            camera.rotation.z = 0;
            
            const hud = document.getElementById('dev-hud');
            hud.textContent = `DEV FLY MODE | X:${devCamPos.x.toFixed(1)} Y:${devCamPos.y.toFixed(1)} Z:${devCamPos.z.toFixed(1)}\nWASD + Space/Shift | Ctrl = Sprint | F12 = Exit`;
        }
        
        // ============ PLAYER MOVEMENT ============
        function updatePlayer() {
            if (!gameStarted) return;
            
            const forward = new THREE.Vector3(-Math.sin(fpCameraYaw), 0, -Math.cos(fpCameraYaw));
            const right = new THREE.Vector3(Math.cos(fpCameraYaw), 0, -Math.sin(fpCameraYaw));
            
            const newPos = myPosition.clone();
            if (fpKeys.w) newPos.add(forward.clone().multiplyScalar(fpMoveSpeed));
            if (fpKeys.s) newPos.add(forward.clone().multiplyScalar(-fpMoveSpeed));
            if (fpKeys.a) newPos.add(right.clone().multiplyScalar(-fpMoveSpeed));
            if (fpKeys.d) newPos.add(right.clone().multiplyScalar(fpMoveSpeed));
            
            if (!checkCollision(newPos)) {
                myPosition.copy(newPos);
            } else {
                // Wall sliding
                const newPosX = myPosition.clone();
                const newPosZ = myPosition.clone();
                
                if (fpKeys.w || fpKeys.s) {
                    const fwd = fpKeys.w ? fpMoveSpeed : -fpMoveSpeed;
                    newPosX.x += forward.x * fwd;
                    newPosZ.z += forward.z * fwd;
                }
                if (fpKeys.a || fpKeys.d) {
                    const side = fpKeys.d ? fpMoveSpeed : -fpMoveSpeed;
                    newPosX.x += right.x * side;
                    newPosZ.z += right.z * side;
                }
                
                if (!checkCollision(newPosX)) myPosition.x = newPosX.x;
                if (!checkCollision(newPosZ)) myPosition.z = newPosZ.z;
            }
            
            // Camera at eye level
            camera.position.copy(myPosition).add(new THREE.Vector3(0, 1.7, 0));
            const cameraForward = new THREE.Vector3(-Math.sin(fpCameraYaw), 0, -Math.cos(fpCameraYaw));
            const cameraRight = new THREE.Vector3(Math.cos(fpCameraYaw), 0, -Math.sin(fpCameraYaw));
            cameraForward.applyAxisAngle(cameraRight, fpCameraPitch);
            camera.lookAt(camera.position.clone().add(cameraForward.multiplyScalar(10)));
            
            // Spray while holding mouse
            if (isSpraying) sprayAtTarget();
            
            // Update coordinates display
            const coordsDiv = document.getElementById('coords');
            coordsDiv.innerHTML = `X: ${myPosition.x.toFixed(2)}<br>Y: ${myPosition.y.toFixed(2)}<br>Z: ${myPosition.z.toFixed(2)}`;
        }

        // Seeded random for consistent world
        function seededRandom(seed) {
            let s = seed;
            return function() {
                s = (s * 16807 + 0) % 2147483647;
                return (s - 1) / 2147483646;
            };
        }
        const rand = seededRandom(42);
        
        function createTree(x, z) {
            const group = new THREE.Group();
            
            const heightVariation = 0.7 + rand() * 0.8;
            const trunk = new THREE.Mesh(trunkGeo, trunkMat);
            trunk.position.y = 2 * heightVariation;
            trunk.scale.set(1, heightVariation, 1);
            group.add(trunk);
            
            const leafMats = [leavesMat, leavesDarkMat, leavesLightMat];
            const chosenLeafMat = leafMats[Math.floor(rand() * leafMats.length)];
            
            const canopy = new THREE.Mesh(rand() > 0.4 ? leavesGeo : smallLeavesGeo, chosenLeafMat);
            canopy.position.y = 4.5 * heightVariation + rand() * 0.5;
            canopy.scale.set(0.8 + rand() * 0.5, 0.7 + rand() * 0.5, 0.8 + rand() * 0.5);
            group.add(canopy);
            
            // Sometimes add a second canopy blob
            if (rand() > 0.5) {
                const canopy2 = new THREE.Mesh(smallLeavesGeo, chosenLeafMat);
                canopy2.position.set((rand() - 0.5) * 2, 3.8 * heightVariation, (rand() - 0.5) * 2);
                canopy2.scale.set(0.6 + rand() * 0.3, 0.5 + rand() * 0.3, 0.6 + rand() * 0.3);
                group.add(canopy2);
            }
            
            group.position.set(x, 0, z);
            group.matrixAutoUpdate = false;
            group.updateMatrix();
            scene.add(group);
            
            // Add trunk collision box
            const trunkBox = new THREE.Box3(
                new THREE.Vector3(x - 0.5, 0, z - 0.5),
                new THREE.Vector3(x + 0.5, 5 * heightVariation, z + 0.5)
            );
            const placeholder = { userData: { worldBox: trunkBox, height: 5 * heightVariation } };
            collisionMeshes.push(placeholder);
            
            return group;
        }
        
        function createRock(x, z, scale) {
            const mat = rand() > 0.5 ? rockMat : rockDarkMat;
            const geo = scale > 0.8 ? rockGeo : smallRockGeo;
            const rock = new THREE.Mesh(geo, mat);
            rock.position.set(x, scale * 0.4, z);
            rock.scale.set(scale, scale * (0.5 + rand() * 0.5), scale);
            rock.rotation.set(rand() * 0.3, rand() * Math.PI * 2, rand() * 0.3);
            rock.matrixAutoUpdate = false;
            rock.updateMatrix();
            scene.add(rock);
            
            // Collision for larger rocks
            if (scale > 0.8) {
                const rockBox = new THREE.Box3(
                    new THREE.Vector3(x - scale, 0, z - scale),
                    new THREE.Vector3(x + scale, scale * 1.2, z + scale)
                );
                collisionMeshes.push({ userData: { worldBox: rockBox, height: scale * 1.2 } });
            }
            
            return rock;
        }
        
        function createGrassClump(x, z) {
            const group = new THREE.Group();
            const bladeCount = 3 + Math.floor(rand() * 5);
            const mat = rand() > 0.5 ? grassMat : grassDarkMat;
            
            for (let i = 0; i < bladeCount; i++) {
                const blade = new THREE.Mesh(grassBladeGeo, mat);
                const bx = (rand() - 0.5) * 0.5;
                const bz = (rand() - 0.5) * 0.5;
                const height = 0.3 + rand() * 0.4;
                blade.position.set(bx, height * 0.5, bz);
                blade.scale.y = height / 0.6;
                blade.rotation.y = rand() * Math.PI;
                blade.rotation.x = (rand() - 0.5) * 0.3;
                group.add(blade);
            }
            
            group.position.set(x, 0, z);
            group.matrixAutoUpdate = false;
            group.updateMatrix();
            scene.add(group);
            return group;
        }
        
        // Generate the world
        function generateWorld() {
            const mapRadius = 120;
            const treeCount = 80;
            const rockCount = 40;
            const grassCount = 300;
            
            // Trees - keep away from spawn point
            for (let i = 0; i < treeCount; i++) {
                const angle = rand() * Math.PI * 2;
                const dist = 8 + rand() * (mapRadius - 10);
                const x = Math.cos(angle) * dist;
                const z = Math.sin(angle) * dist;
                createTree(x, z);
            }
            
            // Rocks
            for (let i = 0; i < rockCount; i++) {
                const x = (rand() - 0.5) * mapRadius * 2;
                const z = (rand() - 0.5) * mapRadius * 2;
                // Skip if too close to spawn
                if (Math.abs(x) < 3 && Math.abs(z) < 3) continue;
                const scale = 0.4 + rand() * 1.8;
                createRock(x, z, scale);
            }
            
            // Grass clumps
            for (let i = 0; i < grassCount; i++) {
                const x = (rand() - 0.5) * mapRadius * 2;
                const z = (rand() - 0.5) * mapRadius * 2;
                createGrassClump(x, z);
            }
            
            // A few scattered rock clusters
            for (let c = 0; c < 6; c++) {
                const cx = (rand() - 0.5) * mapRadius * 1.5;
                const cz = (rand() - 0.5) * mapRadius * 1.5;
                if (Math.abs(cx) < 5 && Math.abs(cz) < 5) continue;
                for (let r = 0; r < 3 + Math.floor(rand() * 4); r++) {
                    createRock(cx + (rand() - 0.5) * 5, cz + (rand() - 0.5) * 5, 0.3 + rand() * 1.2);
                }
            }
        }
        
        generateWorld();
        loadingDiv.style.display = 'none';
        
        // Build flat list of meshes for spray raycasting
        function buildSprayTargets() {
            sprayTargetMeshes = [];
            scene.traverse((child) => {
                if (child.isMesh) sprayTargetMeshes.push(child);
            });
        }
        buildSprayTargets();
        
        // ============ VIEWMODEL INIT ============
        initViewmodelScene();
        
        // ============ MOBILE CONTROLS ============
        const isMobile = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
        const mobileControls = document.getElementById('mobile-controls');
        const mobileJoystick = document.getElementById('mobile-joystick');
        const mobileJoystickThumb = document.getElementById('mobile-joystick-thumb');
        const mobileLook = document.getElementById('mobile-look');
        const mobileSprayBtn = document.getElementById('mobile-spray-btn');
        const mobileModeBtn = document.getElementById('mobile-mode-btn');
        const mobileUploadBtn = document.getElementById('mobile-upload-btn');
        const mobileColorBtn = document.getElementById('mobile-color-btn');
        
        let joystickTouchId = null;
        let joystickCenterX = 0, joystickCenterY = 0;
        let joystickDx = 0, joystickDy = 0;
        let lookTouchId = null;
        let lookLastX = 0, lookLastY = 0;
        const mobileLookSensitivity = 0.004;
        
        function showMobileControls() {
            if (isMobile) {
                mobileControls.style.display = 'block';
            }
        }
        
        // Joystick touch handlers
        mobileJoystick.addEventListener('touchstart', (e) => {
            e.preventDefault();
            const touch = e.changedTouches[0];
            joystickTouchId = touch.identifier;
            const rect = mobileJoystick.getBoundingClientRect();
            joystickCenterX = rect.left + rect.width / 2;
            joystickCenterY = rect.top + rect.height / 2;
        }, { passive: false });
        
        mobileJoystick.addEventListener('touchmove', (e) => {
            e.preventDefault();
            for (const touch of e.changedTouches) {
                if (touch.identifier === joystickTouchId) {
                    const maxDist = 50;
                    let dx = touch.clientX - joystickCenterX;
                    let dy = touch.clientY - joystickCenterY;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist > maxDist) { dx = dx / dist * maxDist; dy = dy / dist * maxDist; }
                    joystickDx = dx / maxDist;
                    joystickDy = dy / maxDist;
                    mobileJoystickThumb.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
                }
            }
        }, { passive: false });
        
        function resetJoystick() {
            joystickTouchId = null;
            joystickDx = 0;
            joystickDy = 0;
            mobileJoystickThumb.style.transform = 'translate(-50%, -50%)';
            fpKeys.w = false; fpKeys.a = false; fpKeys.s = false; fpKeys.d = false;
        }
        
        mobileJoystick.addEventListener('touchend', (e) => {
            for (const touch of e.changedTouches) {
                if (touch.identifier === joystickTouchId) resetJoystick();
            }
        });
        mobileJoystick.addEventListener('touchcancel', (e) => {
            for (const touch of e.changedTouches) {
                if (touch.identifier === joystickTouchId) resetJoystick();
            }
        });
        
        // Look touch handlers
        mobileLook.addEventListener('touchstart', (e) => {
            e.preventDefault();
            const touch = e.changedTouches[0];
            lookTouchId = touch.identifier;
            lookLastX = touch.clientX;
            lookLastY = touch.clientY;
        }, { passive: false });
        
        mobileLook.addEventListener('touchmove', (e) => {
            e.preventDefault();
            for (const touch of e.changedTouches) {
                if (touch.identifier === lookTouchId) {
                    const dx = touch.clientX - lookLastX;
                    const dy = touch.clientY - lookLastY;
                    lookLastX = touch.clientX;
                    lookLastY = touch.clientY;
                    fpCameraYaw -= dx * mobileLookSensitivity;
                    fpCameraPitch -= dy * mobileLookSensitivity;
                    fpCameraPitch = Math.max(-fpMaxPitch, Math.min(fpMaxPitch, fpCameraPitch));
                }
            }
        }, { passive: false });
        
        mobileLook.addEventListener('touchend', (e) => {
            for (const touch of e.changedTouches) {
                if (touch.identifier === lookTouchId) lookTouchId = null;
            }
        });
        mobileLook.addEventListener('touchcancel', (e) => {
            for (const touch of e.changedTouches) {
                if (touch.identifier === lookTouchId) lookTouchId = null;
            }
        });
        
        // Spray button
        mobileSprayBtn.addEventListener('touchstart', (e) => {
            e.preventDefault();
            if (imageMode) {
                pasteImageAtTarget();
            } else {
                isSpraying = true;
                sprayAtTarget();
            }
        }, { passive: false });
        mobileSprayBtn.addEventListener('touchend', (e) => { e.preventDefault(); isSpraying = false; }, { passive: false });
        mobileSprayBtn.addEventListener('touchcancel', (e) => { isSpraying = false; });
        
        // Mode toggle button
        mobileModeBtn.addEventListener('touchstart', (e) => {
            e.preventDefault(); e.stopPropagation();
            toggleMode();
            mobileModeBtn.textContent = imageMode ? 'Image' : 'Spray';
            mobileSprayBtn.textContent = imageMode ? 'Paste' : 'Spray';
        }, { passive: false });
        
        // Upload button
        mobileUploadBtn.addEventListener('touchstart', (e) => {
            e.preventDefault(); e.stopPropagation();
            imageFileInput.click();
        }, { passive: false });
        
        // Color button
        mobileColorBtn.addEventListener('touchstart', (e) => {
            e.preventDefault(); e.stopPropagation();
            toggleColorPicker();
        }, { passive: false });
        
        // Update movement from joystick each frame
        function updateMobileJoystick() {
            if (!isMobile || joystickTouchId === null) return;
            const deadzone = 0.15;
            fpKeys.w = joystickDy < -deadzone;
            fpKeys.s = joystickDy > deadzone;
            fpKeys.a = joystickDx < -deadzone;
            fpKeys.d = joystickDx > deadzone;
        }
        
        // ============ WINDOW RESIZE ============
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            if (viewmodelCamera) {
                viewmodelCamera.aspect = window.innerWidth / window.innerHeight;
                viewmodelCamera.updateProjectionMatrix();
            }
        });
        
        // ============ ANIMATION LOOP ============
        function animate() {
            requestAnimationFrame(animate);
            
            updateMobileJoystick();
            
            if (devMode) {
                updateDevFlyCamera();
            } else {
                updatePlayer();
            }
            
            updateViewmodel();
            
            renderer.render(scene, camera);
            
            // Render viewmodel on top
            if (gameStarted && viewmodelScene && viewmodelCamera && !devMode) {
                renderer.autoClear = false;
                renderer.clearDepth();
                renderer.render(viewmodelScene, viewmodelCamera);
                renderer.autoClear = true;
            }
        }
        
        animate();
    </script>
</body>
</html>
