<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kaj Simulator</title>
    <style>
        body { 
            margin: 0; 
            overflow: hidden;
        }
        #loading {
            position: absolute;
            top: 25%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: rgb(255, 255, 255);
            background: rgba(0,0,0,0.8);
            padding: 20px 40px;
            border-radius: 10px;
            font-family: Arial, sans-serif;
            font-size: 24px;
            z-index: 200;
        }
        canvas {
            display: block;
        }
        #coords {
            position: absolute;
            top: 10px;
            right: 10px;
            color: white;
            background: rgba(0,0,0,0.5);
            padding: 10px;
            border-radius: 5px;
            font-family: monospace;
            font-size: 14px;
            z-index: 100;
        }
        #name-input {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%,-50%);
            color: white;
            background: rgba(0,0,0,0.9);
            padding: 30px 50px;
            border-radius: 10px;
            font-family: Arial, sans-serif;
            font-size: 20px;
            z-index: 200;
            text-align: center;
        }
        #name-input input {
            padding: 10px;
            font-size: 18px;
            border: none;
            border-radius: 5px;
            width: 200px;
            text-align: center;
        }
        #name-input button {
            padding: 12px 30px;
            font-size: 18px;
            cursor: pointer;
            border: none;
            border-radius: 5px;
            background: #000;
            color: white;
        }
        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%,-50%);
            z-index: 100;
            pointer-events: none;
            display: none;
        }
        #crosshair .h {
            position: absolute;
            width: 20px;
            height: 2px;
            background: rgba(255,255,255,0.8);
            left: -10px;
            top: -1px;
        }
        #crosshair .v {
            position: absolute;
            width: 2px;
            height: 20px;
            background: rgba(255,255,255,0.8);
            left: -1px;
            top: -10px;
        }
        #spray-hud {
            display: none;
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            background: rgba(0,0,0,0.6);
            padding: 10px 20px;
            border-radius: 8px;
            font-family: Arial, sans-serif;
            font-size: 15px;
            z-index: 100;
            pointer-events: none;
            text-align: center;
        }
        #color-picker {
            display: none;
            position: absolute;
            bottom: 60px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
            background: rgba(0,0,0,0.7);
            padding: 8px 12px;
            border-radius: 8px;
            gap: 6px;
            display: none;
            flex-wrap: wrap;
            justify-content: center;
            max-width: 280px;
        }
        .color-swatch {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            border: 2px solid rgba(255,255,255,0.4);
            cursor: pointer;
            transition: transform 0.1s;
        }
        .color-swatch:hover {
            transform: scale(1.2);
        }
        .color-swatch.active {
            border-color: white;
            transform: scale(1.25);
        }
        #dev-hud {
            display: none;
            position: absolute;
            top: 50px;
            left: 50%;
            transform: translateX(-50%);
            color: #0f0;
            background: rgba(0,0,0,0.8);
            padding: 8px 18px;
            border-radius: 6px;
            font-family: monospace;
            font-size: 14px;
            z-index: 200;
            pointer-events: none;
            white-space: pre;
        }
        /* Image upload button */
        #image-upload-btn {
            display: none;
            position: absolute;
            bottom: 70px;
            right: 20px;
            z-index: 100;
            background: rgba(0,0,0,0.7);
            color: white;
            border: 2px solid rgba(255,255,255,0.4);
            padding: 8px 16px;
            border-radius: 8px;
            font-family: Arial, sans-serif;
            font-size: 14px;
            cursor: pointer;
        }
        #image-upload-btn:hover { background: rgba(0,0,0,0.9); }
        #image-upload-btn.has-image { border-color: #4f4; }
        #mode-indicator {
            display: none;
            position: absolute;
            bottom: 100px;
            right: 20px;
            z-index: 100;
            background: rgba(0,0,0,0.7);
            color: white;
            padding: 6px 14px;
            border-radius: 8px;
            font-family: Arial, sans-serif;
            font-size: 13px;
            pointer-events: none;
        }
        /* Mobile controls */
        #mobile-controls {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 90;
            pointer-events: none;
        }
        #mobile-joystick {
            position: absolute;
            bottom: 30px;

        #mobile-look {
            position: absolute;

            pointer-events: auto;
            touch-action: none;
        }
        #mobile-spray-btn {
            position: absolute;
            bottom: 30px;
            right: 30px;
            width: 70px;
            height: 70px;
            border-radius: 50%;

        }
        #mobile-mode-btn {
            position: absolute;

            border: 1px solid rgba(255,255,255,0.3);

            display: flex;
            align-items: center;

        }
        #mobile-upload-btn {
            position: absolute;
            bottom: 155px;
            right: 35px;
            width: 60px;
            height: 36px;
            border-radius: 8px;
            background: rgba(0,0,0,0.6);
            border: 1px solid rgba(255,255,255,0.3);

            touch-action: none;
            display: flex;

            justify-content: center;
            font-family: Arial, sans-serif;

        #mobile-color-btn {
            position: absolute;

            border-radius: 8px;

            justify-content: center;

            color: white;
        }
        /* Kaj Simulator Honda Civic HUD */
        #car-indicator {
            display: none;
            position: absolute;
            top: 55%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #7cff7c;
            font-family: Arial, sans-serif;
            font-size: 18px;
            font-weight: bold;
            background: rgba(0, 0, 0, 0.6);
            padding: 8px 16px;
            border-radius: 5px;
            z-index: 140;
            pointer-events: none;
        }
        #car-speed-hud {
            display: none;
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            background: rgba(0, 0, 0, 0.7);
            padding: 10px 20px;
            border-radius: 5px;
            font-family: Arial, sans-serif;
            font-size: 16px;
            z-index: 100;
            pointer-events: none;
        }
        #ped-talk-indicator {
            display: none;
            position: absolute;
            top: 61%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #ffdf6b;
            font-family: Arial, sans-serif;
            font-size: 17px;
            font-weight: bold;
            background: rgba(0, 0, 0, 0.72);
            border: 1px solid rgba(255, 223, 107, 0.5);
            padding: 7px 16px;

            z-index: 140;

        }
        #ped-dialog {
            display: none;
            position: absolute;
            bottom: 85px;
            left: 50%;
            transform: translateX(-50%);
            min-width: 280px;
            max-width: 480px;
            color: #ffffff;
            background: rgba(15, 20, 30, 0.88);

            padding: 12px 22px;
            border-radius: 10px;
            font-family: Arial, sans-serif;

        }
        #ped-dialog-speaker {
            color: #ffdf6b;

        }
        /* In-Car Radio HUD (Bottom-Left) */
        #radio-ui {
            display: none;
            position: absolute;
            bottom: 25px;
            left: 25px;
            z-index: 200;
            background: rgba(15, 23, 42, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            padding: 12px 16px;
            color: #f1f5f9;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.55), 0 0 12px rgba(99, 102, 241, 0.25);
            min-width: 270px;
            pointer-events: auto;
            user-select: none;
            backdrop-filter: blur(8px);
        }
        #radio-header {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 10px;
        }
        #radio-badge {
            background: #4f46e5;
            color: white;
            font-size: 11px;
            font-weight: bold;
            padding: 2px 7px;
            border-radius: 4px;
            letter-spacing: 0.5px;
        }
        #radio-track-title {
            font-size: 13px;
            font-weight: 600;
            color: #f8fafc;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 180px;
        }
        #radio-controls {
            display: flex;
            gap: 8px;
            margin-bottom: 10px;
        }
        #radio-controls button {
            flex: 1;
            background: rgba(255, 255, 255, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.22);
            border-radius: 6px;
            color: #ffffff;
            padding: 6px 10px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.15s, border-color 0.15s;
        }
        #radio-controls button:hover {
            background: rgba(255, 255, 255, 0.25);
            border-color: rgba(255, 255, 255, 0.4);
        }
        #radio-controls button:active {
            background: rgba(99, 102, 241, 0.6);
        }
        #radio-volume-row {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
        }
        #radio-vol-icon {
            font-size: 14px;
        }
        #radio-volume-slider {
            flex: 1;
            accent-color: #6366f1;
            cursor: pointer;
            height: 5px;
        }
        #radio-volume-val {
            font-size: 11px;
            color: #94a3b8;
            min-width: 32px;
            text-align: right;
        }
    </style>
</head>
<body>
    <div id="coords">X: 0.00<br>Y: 0.00<br>Z: 0.00</div>
    <div id="name-input">
        <div style="margin-bottom:15px;">NAME</div>
        <input type="text" id="player-name" maxlength="20" placeholder="Your Name">
        <br><br>
        <button id="join-btn">Join Game</button>
    </div>
    <div id="loading">Loading map...</div>
    <div id="car-indicator"><span class="key-hint">(E) </span>Enter Car</div>
    <div id="ped-talk-indicator"><span class="key-hint">(E) </span>Talk</div>
    <div id="ped-dialog"><div id="ped-dialog-speaker">Pedestrian</div><div id="ped-dialog-text"></div></div>
    <div id="car-speed-hud">Speed: <span id="car-speed-val">0</span> mph</div>
    <!-- In-Car Radio HUD (Bottom-Left) -->
    <div id="radio-ui">
        <div id="radio-header">
            <span id="radio-badge">📻 RADIO</span>
            <span id="radio-track-title">Hot In Herre</span>
        </div>
        <div id="radio-controls">
            <button id="radio-btn-restart" type="button" title="Restart Track (⏮)">⏮ Restart</button>
            <button id="radio-btn-pause" type="button" title="Play / Pause (R)">⏸ Pause</button>
            <button id="radio-btn-skip" type="button" title="Skip to Next Track (N)">⏭ Skip</button>
        </div>
        <div id="radio-volume-row">
            <span id="radio-vol-icon">🔊</span>
            <input type="range" id="radio-volume-slider" min="0" max="1" step="0.01" value="0.5">
            <span id="radio-volume-val">50%</span>
        </div>
    </div>
    <div id="crosshair"><div class="h"></div><div class="v"></div></div>
    <div id="spray-hud">Spray Can | Scroll to resize | C colors | V mode</div>
    <div id="color-picker"></div>
    <div id="dev-hud">DEV FLY MODE
WASD + Space/Shift | Ctrl = Sprint | F12 = Exit</div>
    <input type="file" id="image-file-input" accept="image/*" style="display:none">
    <button id="image-upload-btn">📷 Upload Image</button>
    <div id="mode-indicator">Mode: Spray</div>
    <div id="mobile-controls">
        <div id="mobile-joystick"><div id="mobile-joystick-thumb"></div></div>
        <div id="mobile-look"></div>
        <div id="mobile-spray-btn">Spray</div>
        <div id="mobile-mode-btn">V Mode</div>
        <div id="mobile-upload-btn">📷 Img</div>
        <div id="mobile-color-btn">C Color</div>
    </div>
    
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
    
    <script type="module">
        import * as THREE from 'three';
        import {
            CONFIG,
            spatialGrid,
            initGameAPI,
            OSMRoadNetwork,
            ANOTHERMAPO_CONFIG,
            Vehicle,
            PlayerController,
            CameraController,
            PlayerState,
            TrafficManager,
            AnothermapoLoader,
            ensureCivicHUD,
            updateCivicHUD
        } from './js/game/main.js';

        // ============ SCENE SETUP ============
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xa8d8f0);
        scene.fog = new THREE.Fog(0xa8d8f0, 150, 800);
        
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.25, 3000);
        
        // Player starting position at Kaj's house in /anothermapo
        const playerStartPos = new THREE.Vector3(
            ANOTHERMAPO_CONFIG.SPAWN.PLAYER_START.x,
            ANOTHERMAPO_CONFIG.SPAWN.PLAYER_START.y,
            ANOTHERMAPO_CONFIG.SPAWN.PLAYER_START.z
        );
        const myPosition = new THREE.Vector3();
        
        // Collision detection
        const collisionMeshes = [];
        const playerRadius = 0.4;
        
        // ============ RENDERER (SHADOWS, TONE MAPPING & SHADERS) ============
        const renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: 'high-performance' });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.35;
        renderer.outputColorSpace = THREE.SRGBColorSpace;
        document.body.appendChild(renderer.domElement);
        
        // ============ LIGHTING, SHADOWS & PROCEDURAL SKY / SUN SHADERS ============
        const sunDirection = new THREE.Vector3(80, 180, 60).normalize();

        // Atmospheric Sky Dome with custom GLSL Rayleigh/Mie scattering & solar halo shader
        const skyDomeGeo = new THREE.SphereGeometry(2400, 32, 20);
        const skyDomeMat = new THREE.ShaderMaterial({
            name: 'AtmosphericSkyShader',
            side: THREE.BackSide,
            depthWrite: false,
            uniforms: {
                uSunDir: { value: sunDirection.clone() },
                uZenithColor: { value: new THREE.Color(0x2868c7) },
                uHorizonColor: { value: new THREE.Color(0xb8e2ff) },
                uGroundColor: { value: new THREE.Color(0x6e8562) },
                uSunColor: { value: new THREE.Color(0xfff4d2) }
            },
            vertexShader: `
                varying vec3 vWorldDir;
                void main() {
                    vec4 wp = modelMatrix * vec4(position, 1.0);
                    vWorldDir = normalize(position);
                    gl_Position = projectionMatrix * viewMatrix * wp;
                }
            `,
            fragmentShader: `
                uniform vec3 uSunDir;
                uniform vec3 uZenithColor;
                uniform vec3 uHorizonColor;
                uniform vec3 uGroundColor;
                uniform vec3 uSunColor;
                varying vec3 vWorldDir;
                void main() {
                    vec3 dir = normalize(vWorldDir);
                    float y = dir.y;
                    vec3 skyCol = y >= 0.0
                        ? mix(uHorizonColor, uZenithColor, pow(clamp(y, 0.0, 1.0), 0.55))
                        : mix(uHorizonColor, uGroundColor, clamp(-y * 3.0, 0.0, 1.0));
                    float sunDot = max(dot(dir, normalize(uSunDir)), 0.0);
                    // Atmospheric Mie glow around the sun
                    skyCol += uSunColor * pow(sunDot, 16.0) * 0.45;
                    // Intense solar corona & disc
                    skyCol += vec3(1.0, 0.98, 0.9) * smoothstep(0.9982, 0.9996, sunDot) * 2.2;
                    gl_FragColor = vec4(skyCol, 1.0);
                }
            `
        });
        const skyDomeMesh = new THREE.Mesh(skyDomeGeo, skyDomeMat);
        skyDomeMesh.name = 'sky_shader_dome';
        skyDomeMesh.frustumCulled = false;
        scene.add(skyDomeMesh);

        // Visible 3D Sun in the Sky (Core Sphere + Custom GLSL Corona Shader Billboard)
        const sunSkyGroup = new THREE.Group();
        sunSkyGroup.name = 'sky_sun';
        const sunSkyPos = sunDirection.clone().multiplyScalar(1400);
        sunSkyGroup.position.copy(sunSkyPos);

        const sunCoreGeo = new THREE.SphereGeometry(52, 24, 24);
        const sunCoreMat = new THREE.MeshBasicMaterial({
            name: 'SunCoreMaterial',
            color: 0xfffbe6,
            fog: false
        });
        const sunCoreMesh = new THREE.Mesh(sunCoreGeo, sunCoreMat);
        sunCoreMesh.name = 'sun_core_sphere';
        sunSkyGroup.add(sunCoreMesh);

        const sunHaloGeo = new THREE.PlaneGeometry(340, 340);
        const sunHaloMat = new THREE.ShaderMaterial({
            name: 'SunCoronaShader',
            transparent: true,
            depthWrite: false,
            blending: THREE.AdditiveBlending,
            side: THREE.DoubleSide,
            uniforms: {
                uColorInner: { value: new THREE.Color(0xfffae0) },
                uColorOuter: { value: new THREE.Color(0xff9922) }
            },
            vertexShader: `
                varying vec2 vUv;
                void main() {
                    vUv = uv * 2.0 - 1.0;
                    gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                }
            `,
            fragmentShader: `
                uniform vec3 uColorInner;
                uniform vec3 uColorOuter;
                varying vec2 vUv;
                void main() {
                    float r = length(vUv);
                    float glow = exp(-r * 3.4) * (1.0 - smoothstep(0.75, 1.0, r));
                    vec3 col = mix(uColorOuter, uColorInner, exp(-r * 2.5));
                    gl_FragColor = vec4(col, glow * 0.9);
                }
            `
        });
        const sunHaloMesh = new THREE.Mesh(sunHaloGeo, sunHaloMat);
        sunHaloMesh.name = 'sun_corona_halo';
        sunSkyGroup.add(sunHaloMesh);
        scene.add(sunSkyGroup);

        // Hemisphere light for natural sky/ground color bounce
        const hemiLight = new THREE.HemisphereLight(0x87ceeb, 0x556b2f, 0.75);
        hemiLight.position.set(0, 200, 0);
        scene.add(hemiLight);

        // Bright ambient fill
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.45);
        scene.add(ambientLight);
        
        // Main sun directional light with follow-player PCFSoftShadowMap shadows
        const sunLight = new THREE.DirectionalLight(0xfff5e6, 1.9);
        sunLight.name = 'sun_directional_light';
        sunLight.position.set(80, 180, 60);
        sunLight.castShadow = true;
        sunLight.shadow.mapSize.width = 1024;
        sunLight.shadow.mapSize.height = 1024;
        sunLight.shadow.camera.near = 10;
        sunLight.shadow.camera.far = 420;
        const shadowExtent = 95;
        sunLight.shadow.camera.left = -shadowExtent;
        sunLight.shadow.camera.right = shadowExtent;
        sunLight.shadow.camera.top = shadowExtent;
        sunLight.shadow.camera.bottom = -shadowExtent;
        sunLight.shadow.bias = -0.0008;
        scene.add(sunLight);
        scene.add(sunLight.target);

        // Secondary fill light from opposite direction
        const fillLight = new THREE.DirectionalLight(0xc4deff, 0.45);
        fillLight.position.set(-60, 100, -80);
        scene.add(fillLight);

        // ============ /ANOTHERMAPO OSM ROAD NETWORK ============
        const roadNetwork = new OSMRoadNetwork();

        // ============ CAMERA CONTROLLER (FIRST-PERSON & CHASE) ============
        const cameraController = new CameraController({ camera, domElement: renderer.domElement });

        // ============ PLAYER CONTROLLER & VEHICLES ============
        myPosition.copy(playerStartPos);
        const playerController = new PlayerController({
            camera,
            cameraController,
            spatialGrid,
            initialPosition: myPosition,
            playerPosition: myPosition,
            domElement: document.body,
            onExit: (pos) => {
                myPosition.copy(pos);
                if (camera) {
                    camera.position.set(pos.x, pos.y + 1.7, pos.z);
                }
            }
        });

        // Spawn player's Kaj Simulator Honda Civic (black 0x111111) at Kaj's house driveway within 3.5m boarding range
        ensureCivicHUD(document.body);
        const playerVehicle = new Vehicle(
            'player_vehicle',
            ANOTHERMAPO_CONFIG.SPAWN.CIVIC_START.x,

            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, size, size);
            const texture = new THREE.CanvasTexture(canvas);

        function pasteImageAtTarget() {
            if (!uploadedTexture) return;
            
            sprayRaycaster.setFromCamera(new THREE.Vector2(0, 0), camera);

            const intersects = sprayRaycaster.intersectObjects(sprayTargetMeshes, false);

            const hit = intersects[0];
            if (!hit.face) return;
            
            const normal = hit.face.normal.clone();
            if (hit.object.matrixWorld) {
                const normalMatrix = new THREE.Matrix3().getNormalMatrix(hit.object.matrixWorld);
                normal.applyMatrix3(normalMatrix).normalize();
            }
            
            // Compute aspect ratio from uploaded image
            const img = uploadedTexture.image;
            const aspect = img.width / img.height;
            const w = imageSize * (aspect >= 1 ? 1 : aspect);
            const h = imageSize * (aspect >= 1 ? 1 / aspect : 1);
            
            const decalMat = new THREE.MeshBasicMaterial({
                map: uploadedTexture,
                transparent: true,
                depthWrite: false,
                side: THREE.DoubleSide
            });
            
            const decalPos = hit.point.clone().add(normal.clone().multiplyScalar(0.015));
            const decal = new THREE.Mesh(sharedDecalGeo, decalMat);
            decal.scale.set(w, h, 1);
            decal.position.copy(decalPos);
            decal.lookAt(decalPos.clone().add(normal));
            
            scene.add(decal);
            imageDecals.push(decal);
            
            if (imageDecals.length > maxImageDecals) {
                const old = imageDecals.shift();
                scene.remove(old);
                old.material.dispose();
            }
        }
        
        function sprayAtTarget() {
            const now = Date.now();
            if (now - lastSprayTime < sprayRate) return;
            lastSprayTime = now;
            
            // Raycast from screen center
            sprayRaycaster.setFromCamera(new THREE.Vector2(0, 0), camera);
            sprayRaycaster.far = 20; // spray range
            
            // Raycast only against cached map meshes (not all scene children)
            const intersects = sprayRaycaster.intersectObjects(sprayTargetMeshes, false);
            
            if (intersects.length > 0) {
                const hit = intersects[0];
                if (!hit.face) return;
                
                // Create decal at hit point
                const normal = hit.face.normal.clone();
                // Transform normal to world space
                if (hit.object.matrixWorld) {
                    const normalMatrix = new THREE.Matrix3().getNormalMatrix(hit.object.matrixWorld);
                    normal.applyMatrix3(normalMatrix).normalize();
                }
                
                // Small random offset for spray effect
                const jitter = spraySize * 0.3;
                const tangent = new THREE.Vector3().crossVectors(normal, new THREE.Vector3(0, 1, 0));
                if (tangent.length() < 0.01) tangent.crossVectors(normal, new THREE.Vector3(1, 0, 0));
                tangent.normalize();
                const bitangent = new THREE.Vector3().crossVectors(normal, tangent).normalize();
                
                const offsetX = (Math.random() - 0.5) * jitter;
                const offsetY = (Math.random() - 0.5) * jitter;
                
                const sprayPos = hit.point.clone()
                    .add(normal.clone().multiplyScalar(0.01))
                    .add(tangent.clone().multiplyScalar(offsetX))
                    .add(bitangent.clone().multiplyScalar(offsetY));
                
                // Vary the size slightly for natural look
                const sizeVariation = spraySize * (0.7 + Math.random() * 0.6);
                
                const decalMat = new THREE.MeshBasicMaterial({
                    color: currentSprayColor,
                    map: sprayTexture,
                    transparent: true,
                    opacity: 0.6 + Math.random() * 0.3,
                    depthWrite: false,
                    side: THREE.DoubleSide
                });
                
                const decal = new THREE.Mesh(sharedDecalGeo, decalMat);
                decal.scale.set(sizeVariation, sizeVariation, 1);
                decal.position.copy(sprayPos);
                
                // Orient decal to face along the surface normal
                decal.lookAt(sprayPos.clone().add(normal));
                
                // Small random rotation for variety

                scene.add(decal);

        // ============ CAR ACCELERATING, BRAKING & DRIVING AUDIO SYSTEM ============
        const carAudioState = {

            rpmNormalized: 0,
            engineFreqHz: 0,
            engineGain: 0,

        let _carAudioCtx = null;

        let _engineGainNode = null;
        let _brakeNoiseNode = null;
        let _brakeFilterNode = null;
        let _brakeGainNode = null;

        function ensureCarAudioEngine() {
            if (_carAudioCtx) return _carAudioCtx;
            try {
                const AudioCtx = window.AudioContext || window.webkitAudioContext;
                if (!AudioCtx) return null;
                _carAudioCtx = new AudioCtx();

                // Dual-oscillator Honda Civic 4-cylinder engine synthesizer (sawtooth + sub-octave triangle)
                _engineOsc1 = _carAudioCtx.createOscillator();
                _engineOsc2 = _carAudioCtx.createOscillator();
                _engineOsc1.type = 'sawtooth';
                _engineOsc2.type = 'triangle';
                _engineOsc1.frequency.value = 55;
                _engineOsc2.frequency.value = 110;

                const engineFilter = _carAudioCtx.createBiquadFilter();
                engineFilter.type = 'lowpass';
                engineFilter.frequency.value = 340;

                _engineGainNode = _carAudioCtx.createGain();
                _engineGainNode.gain.value = 0;

                _engineOsc1.connect(engineFilter);
                _engineOsc2.connect(engineFilter);
                engineFilter.connect(_engineGainNode);
                _engineGainNode.connect(_carAudioCtx.destination);
                _engineOsc1.start();
                _engineOsc2.start();

                // Bandpass-filtered white noise generator for tire braking / screeching sound
                const bufferSize = _carAudioCtx.sampleRate * 1.0;
                const noiseBuffer = _carAudioCtx.createBuffer(1, bufferSize, _carAudioCtx.sampleRate);
                const data = noiseBuffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) {
                    data[i] = Math.random() * 2 - 1;
                }
                _brakeNoiseNode = _carAudioCtx.createBufferSource();
                _brakeNoiseNode.buffer = noiseBuffer;
                _brakeNoiseNode.loop = true;

                _brakeFilterNode = _carAudioCtx.createBiquadFilter();
                _brakeFilterNode.type = 'bandpass';
                _brakeFilterNode.frequency.value = 1650;
                _brakeFilterNode.Q.value = 4.5;

                _brakeGainNode = _carAudioCtx.createGain();
                _brakeGainNode.gain.value = 0;

                _brakeNoiseNode.connect(_brakeFilterNode);
                _brakeFilterNode.connect(_brakeGainNode);
                _brakeGainNode.connect(_carAudioCtx.destination);
                _brakeNoiseNode.start();
            } catch (e) {
                _carAudioCtx = null;
            }
            return _carAudioCtx;
        }

        function updateCarAudio(vehicle, isInVehicle) {
            if (!isInVehicle || !vehicle) {
                carAudioState.isPlaying = false;
                carAudioState.mode = 'off';
                carAudioState.rpmNormalized = 0;
                carAudioState.engineFreqHz = 0;
                carAudioState.engineGain = 0;
                carAudioState.brakeScreechGain = 0;
                carAudioState.speed = 0;
                carAudioState.wasAccelerating = false;
                carAudioState.wasBraking = false;
                if (_engineGainNode && _carAudioCtx) {
                    _engineGainNode.gain.setTargetAtTime(0, _carAudioCtx.currentTime, 0.05);
                }
                if (_brakeGainNode && _carAudioCtx) {
                    _brakeGainNode.gain.setTargetAtTime(0, _carAudioCtx.currentTime, 0.04);
                }
                return;
            }

            ensureCarAudioEngine();
            if (_carAudioCtx && _carAudioCtx.state === 'suspended') {
                _carAudioCtx.resume().catch(() => {});
            }

            const spd = Math.abs(typeof vehicle.getSpeed === 'function' ? vehicle.getSpeed() : (vehicle.speed || 0));
            const maxSpd = vehicle.maxForwardSpeed || 28.0;
            const speedRatio = Math.min(1.0, spd / maxSpd);

            const isThrottling = !!(vehicle.inputThrottle > 0.05 || (playerController && playerController.keys && playerController.keys.w));
            const isBrakingInput = !!(vehicle.inputBrake > 0.05 || vehicle.inputHandbrake || (playerController && playerController.keys && (playerController.keys.s || playerController.keys.space)));
            const isBrakingWhileMoving = isBrakingInput && spd > 0.15;

            // Compute simulated gear RPM & engine pitch
            const gearRatio = (speedRatio * 3.2) % 1.0;
            const rpmNorm = Math.min(1.0, 0.18 + speedRatio * 0.55 + gearRatio * 0.22 + (isThrottling ? 0.18 : 0));
            const baseFreq = 52 + rpmNorm * 165;
            const engineGain = isThrottling ? 0.16 : (spd > 0.5 ? 0.11 : 0.06);
            const brakeGain = isBrakingWhileMoving ? Math.min(0.18, 0.05 + speedRatio * 0.15) : 0;

            let mode = 'idle';
            if (isBrakingWhileMoving) {
                mode = 'braking';
            } else if (isThrottling) {
                mode = 'accelerating';
            } else if (spd > 0.5) {
                mode = 'driving';
            }

            if (isThrottling && !carAudioState.wasAccelerating) {
                carAudioState.accelSoundCount++;
            }
            if (isBrakingWhileMoving && !carAudioState.wasBraking) {
                carAudioState.brakeSoundCount++;
            }
            if (spd > 0.5) {
                carAudioState.drivingTickCount++;
            }

            carAudioState.isPlaying = true;
            carAudioState.mode = mode;
            carAudioState.rpmNormalized = rpmNorm;
            carAudioState.engineFreqHz = baseFreq;
            carAudioState.engineGain = engineGain;
            carAudioState.brakeScreechGain = brakeGain;
            carAudioState.speed = spd;
            carAudioState.wasAccelerating = isThrottling;
            carAudioState.wasBraking = isBrakingWhileMoving;

            if (_carAudioCtx && _engineOsc1 && _engineOsc2 && _engineGainNode && _brakeGainNode) {
                const now = _carAudioCtx.currentTime;
                _engineOsc1.frequency.setTargetAtTime(baseFreq, now, 0.04);

            const mat = new THREE.MeshBasicMaterial({

                depthWrite: false,
                side: THREE.DoubleSide
            });
            const pool = new THREE.Mesh(sharedBloodGeo, mat);

            pool.position.set(position.x, 0.03, position.z);

            const poolEntry = {
                mesh: pool,
                position: pool.position,
                scale: 0.35,
                targetScale: 1.25 + Math.random() * 0.45
            };
            bloodPools.push(poolEntry);

            if (bloodPools.length > maxBloodPools) {
                const oldest = bloodPools.shift();
                scene.remove(oldest.mesh);
                oldest.mesh.material.dispose();
            }
            return poolEntry;
        }

        function updateBloodPools() {
            for (let i = 0; i < bloodPools.length; i++) {

                if (bp.scale < bp.targetScale) {

                    bp.mesh.scale.set(bp.scale, 1, bp.scale);

            }

        let carjackState = {

            vehicle: null,

        function startCarjackAnimation(targetVehicle) {
            if (!targetVehicle || carjackState.active) return null;

            // Stop the moving car immediately and claim it from AI traffic control
            targetVehicle.isPlayer = true;
            targetVehicle.speed = 0;
            targetVehicle.velocity.set(0, 0);
            targetVehicle.setInputs(0, 0, 1.0, true);

            // Mount the vehicle's individual mesh in scene so its animated driver door is visible
            if (targetVehicle.mesh && !targetVehicle.mesh.parent) {
                scene.add(targetVehicle.mesh);
            }
            targetVehicle._updateMeshTransform(0);

            // Auto-equip Pistol (or keep current gun if a gun is already equipped) to point at driver
            const prevWeapon = currentWeaponIndex;
            if (currentWeaponIndex === 0) {
                selectWeapon('Pistol');
            }

            // Compute driver door world coordinates (left side of vehicle)
            const vYaw = targetVehicle.yaw;
            const cosY = Math.cos(vYaw);
            const sinY = Math.sin(vYaw);
            const leftX = -cosY;
            const leftZ = sinY;
            const doorWorldX = targetVehicle.position.x + leftX * 1.45;
            const doorWorldZ = targetVehicle.position.z + leftZ * 1.45;

            // Position player outside the driver's door aiming in at the driver
            myPosition.set(doorWorldX + leftX * 0.45, 0, doorWorldZ + leftZ * 0.45);
            playerController.position.copy(myPosition);

            // Spawn the car's driver NPC inside the driver's seat
            const driverIdx = pedestrians.length;
            const driverMesh = createPedestrianMesh(driverIdx);
            const seatX = targetVehicle.position.x + leftX * 0.35;
            const seatZ = targetVehicle.position.z + leftZ * 0.35;
            driverMesh.position.set(seatX, 0.1, seatZ);
            driverMesh.rotation.y = vYaw;
            scene.add(driverMesh);

            const driverPed = {
                id: `ped_driver_${driverIdx}`,
                index: driverIdx,
                isCarjackedDriver: true,
                mesh: driverMesh,
                position: driverMesh.position,
                velocity: new THREE.Vector3(leftX * 0.22, 0, leftZ * 0.22),
                speed: 0.22,
                state: 'carjacked',
                hp: 100,
                maxHp: 100,
                isDead: false,
                laneId: targetVehicle.laneId || (roadNetwork.lanes[0] && roadNetwork.lanes[0].id),
                wpIndex: 0,
                sideOffset: 3.2,
                walkPhase: 0,
                fleeTimer: 600,
                talkTimer: 0,
                talkCount: 0
            };
            driverMesh.userData.pedestrian = driverPed;
            pedestrians.push(driverPed);

            carjackState = {
                active: true,
                phase: 'opening_door',
                timer: 0,
                duration: 1.5,
                vehicle: targetVehicle,
                driverPed,
                doorAngle: 0,
                gunPointed: true,
                driverExited: false,
                driverFleeing: false,
                previousWeaponIndex: prevWeapon,
                completedCount: (carjackState.completedCount || 0)
            };

            return carjackState;
        }

        function updateCarjackAnimation(dt = 1 / 60) {
            if (!carjackState.active || !carjackState.vehicle) return;

            carjackState.timer += dt;
            const t = carjackState.timer;
            const v = carjackState.vehicle;
            const ped = carjackState.driverPed;

            const vYaw = v.yaw;
            const cosY = Math.cos(vYaw);
            const sinY = Math.sin(vYaw);
            const leftX = -cosY;
            const leftZ = sinY;

            // Keep car stationary during the carjacking sequence
            v.speed = 0;
            v.velocity.set(0, 0);

            // Phase 1 (0.0s -> 0.45s): Swing driver door open & raise gun at driver
            if (t <= 0.45) {
                carjackState.phase = 'opening_door';
                const p = Math.min(1.0, t / 0.45);
                carjackState.doorAngle = p * 1.15;
                v.setDoorAngle(carjackState.doorAngle);
                viewmodelRecoil = -0.06 * Math.sin(p * Math.PI);
            }
            // Phase 2 (0.45s -> 1.05s): Point gun at driver, forcing them out of the car
            else if (t <= 1.05) {
                carjackState.phase = 'forcing_driver_out';
                carjackState.doorAngle = 1.15;
                v.setDoorAngle(1.15);
                carjackState.driverExited = true;

                const p = Math.min(1.0, (t - 0.45) / 0.60);
                if (ped && !ped.isDead) {
                    const startX = v.position.x + leftX * 0.35;
                    const startZ = v.position.z + leftZ * 0.35;
                    const exitX = v.position.x + leftX * 2.15;
                    const exitZ = v.position.z + leftZ * 2.15;
                    ped.mesh.position.set(
                        startX + (exitX - startX) * p,
                        0.1 * (1.0 - p),
                        startZ + (exitZ - startZ) * p
                    );
                    // Driver faces player in fear while stepping out, then turns to flee
                    const toPlayerX = myPosition.x - ped.mesh.position.x;
                    const toPlayerZ = myPosition.z - ped.mesh.position.z;
                    ped.mesh.rotation.y = Math.atan2(toPlayerX, toPlayerZ);
                    ped.walkPhase += 0.25;
                    const swing = Math.sin(ped.walkPhase) * 0.45;
                    if (ped.mesh.userData.leftLeg && ped.mesh.userData.rightLeg) {
                        ped.mesh.userData.leftLeg.rotation.x = swing;
                        ped.mesh.userData.rightLeg.rotation.x = -swing;
                    }
                }
            }
            // Phase 3 (1.05s -> 1.50s): Driver runs away in panic, player climbs in & shuts door
            else if (t < carjackState.duration) {
                carjackState.phase = 'driver_running_away';
                carjackState.driverExited = true;
                carjackState.driverFleeing = true;

                const p = Math.min(1.0, (t - 1.05) / 0.45);
                carjackState.doorAngle = 1.15 * (1.0 - p);
                v.setDoorAngle(carjackState.doorAngle);

                if (ped && !ped.isDead && ped.state !== 'fleeing') {
                    ped.state = 'fleeing';
                    ped.speed = 0.22;
                    ped.fleeTimer = 600;
                    const fwdX = -sinY;
                    const fwdZ = -cosY;
                    const fleeDirX = leftX * 0.8 - fwdX * 0.6;
                    const fleeDirZ = leftZ * 0.8 - fwdZ * 0.6;
                    const fLen = Math.hypot(fleeDirX, fleeDirZ) || 1;
                    ped.velocity.set((fleeDirX / fLen) * ped.speed, 0, (fleeDirZ / fLen) * ped.speed);
                }

                // Interpolate player into driver seat
                const doorStandX = v.position.x + leftX * 1.8;
                const doorStandZ = v.position.z + leftZ * 1.8;
                myPosition.set(
                    doorStandX + (v.position.x - doorStandX) * p,
                    0,
                    doorStandZ + (v.position.z - doorStandZ) * p
                );
                playerController.position.copy(myPosition);
            }
            // Complete carjacking: transition player into IN_VEHICLE state
            else {
                v.setDoorAngle(0);
                if (ped && !ped.isDead) {
                    ped.state = 'fleeing';
                    ped.speed = 0.22;
                    ped.fleeTimer = 600;
                }
                carjackState.active = false;
                carjackState.phase = 'completed';
                carjackState.doorAngle = 0;
                carjackState.driverExited = true;
                carjackState.driverFleeing = true;
                carjackState.completedCount++;
                playerController.enterVehicle(v);
                return;
            }

            // Aim first-person camera at the driver/door during the carjacking animation
            camera.position.set(myPosition.x, myPosition.y + 1.65, myPosition.z);
            const lookTargetX = (ped && !carjackState.driverFleeing) ? ped.mesh.position.x : v.position.x;
            const lookTargetZ = (ped && !carjackState.driverFleeing) ? ped.mesh.position.z : v.position.z;
            camera.lookAt(lookTargetX, 1.15, lookTargetZ);
            v._updateMeshTransform(0);
        }

        function tryBoardOrJackVehicle() {
            if (carjackState.active) return true;
            if (playerController.getState() !== 'ON_FOOT') return false;
            const candidateVehicles = [playerVehicle, ...trafficVehicles];
            const nearCar = playerController.getNearbyVehicle(candidateVehicles);
            if (!nearCar) return false;

            const carSpeed = Math.abs(typeof nearCar.getSpeed === 'function' ? nearCar.getSpeed() : (nearCar.speed || 0));
            const isMovingTrafficCar = (nearCar !== playerVehicle && !nearCar.isPlayer && carSpeed > 0.5);
            if (isMovingTrafficCar) {
                startCarjackAnimation(nearCar);
                return true;
            }
            if (nearCar.mesh && !nearCar.mesh.parent) {
                scene.add(nearCar.mesh);
            }
            const entered = playerController.enterVehicle(nearCar);
            if (entered) {
                handleEnterVehicleRadio();
            }
            return entered;
        }

        function getNearbyPedestrian(maxDist = 4.0) {
            let closest = null;
            let minDist = maxDist;
            for (let i = 0; i < pedestrians.length; i++) {
                const ped = pedestrians[i];
                if (!ped || ped.isDead) continue;
                const d = Math.hypot(ped.mesh.position.x - myPosition.x, ped.mesh.position.z - myPosition.z);
                if (d <= minDist) {
                    minDist = d;
                    closest = ped;
                }
            }
            return closest;
        }

        function talkToNearbyPedestrian() {
            if (playerController && playerController.getState() !== 'ON_FOOT') return null;
            const ped = getNearbyPedestrian(4.0);
            if (!ped) return null;

            ped.state = 'talking';
            ped.talkTimer = 240; // 4 seconds at 60Hz
            // Rotate pedestrian to face player
            const dx = myPosition.x - ped.mesh.position.x;
            const dz = myPosition.z - ped.mesh.position.z;
            ped.mesh.rotation.y = Math.atan2(dx, dz);

            const lineIdx = ((ped.talkCount || 0) + ped.index) % PEDESTRIAN_DIALOG_LINES.length;
            ped.talkCount = (ped.talkCount || 0) + 1;
            const speaker = PEDESTRIAN_NAMES[ped.index % PEDESTRIAN_NAMES.length];
            const text = PEDESTRIAN_DIALOG_LINES[lineIdx];

            activeDialog = {
                pedestrianId: ped.id,
                speaker,
                text
            };
            activeDialogTimer = 240;

            const dialogEl = document.getElementById('ped-dialog');
            const speakerEl = document.getElementById('ped-dialog-speaker');
            const textEl = document.getElementById('ped-dialog-text');
            if (speakerEl) speakerEl.textContent = speaker;
            if (textEl) textEl.textContent = `"${text}"`;
            if (dialogEl) dialogEl.style.display = 'block';

            return activeDialog;
        }

        function spawnPedestrians(count = 24) {
            const lanes = roadNetwork.lanes || [];
            if (lanes.length === 0) return;

            for (let i = 0; i < count; i++) {
                const lane = lanes[i % lanes.length];
                if (!lane.waypoints || lane.waypoints.length < 2) continue;

                let wpIndex = Math.floor((i * 3.7 + 4) % lane.waypoints.length);
                let wp = lane.waypoints[wpIndex];
                // Place pedestrian on sidewalk / curb edge (offset 3.2m outside lane)
                const sideSign = (i % 2 === 0) ? 1 : -1;
                const sideOffset = 3.2 * sideSign;
                let nx = -Math.sin(wp.yaw + Math.PI / 2);
                let nz = -Math.cos(wp.yaw + Math.PI / 2);

                let px = wp.x + nx * sideOffset;
                let pz = wp.z + nz * sideOffset;

                // Keep initial spawn clear of player spawn so vehicle boarding at spawn is unambiguous
                if (Math.hypot(px - playerStartPos.x, pz - playerStartPos.z) < 8.0) {
                    wpIndex = (wpIndex + Math.floor(lane.waypoints.length / 2)) % lane.waypoints.length;
                    wp = lane.waypoints[wpIndex];
                    nx = -Math.sin(wp.yaw + Math.PI / 2);
                    nz = -Math.cos(wp.yaw + Math.PI / 2);
                    px = wp.x + nx * sideOffset;
                    pz = wp.z + nz * sideOffset;
                }

                const mesh = createPedestrianMesh(i);
                mesh.position.set(px, 0, pz);
                mesh.rotation.y = wp.yaw;
                scene.add(mesh);

                const ped = {
                    id: `ped_${i}`,
                    index: i,
                    mesh,
                    position: mesh.position,
                    velocity: new THREE.Vector3(),
                    speed: 0.055 + (i % 4) * 0.008,
                    state: 'walking',
                    hp: 100,
                    maxHp: 100,
                    isDead: false,
                    laneId: lane.id,
                    wpIndex: (wpIndex + 1) % lane.waypoints.length,
                    sideOffset,
                    walkPhase: i * 0.9,
                    fleeTimer: 0,
                    talkTimer: 0,
                    talkCount: 0
                };
                mesh.userData.pedestrian = ped;
                pedestrians.push(ped);
            }
        }

        function killPedestrian(ped) {
            if (!ped || ped.isDead) return false;
            ped.hp = 0;
            ped.isDead = true;
            ped.state = 'dead';
            ped.mesh.rotation.x = Math.PI / 2;
            ped.mesh.position.y = 0.25;
            createBloodPool(ped.mesh.position);
            return true;
        }

        // Launch an NPC into a forward ragdoll trajectory scaled by the impacting car's speed
        function hitPedestrianWithVehicle(ped, vehicle) {
            if (!ped || ped.isDead || ped.state === 'ragdoll') return false;
            const rawSpd = typeof vehicle.getSpeed === 'function' ? vehicle.getSpeed() : (vehicle.speed || 0);
            const absSpeed = Math.abs(rawSpd);
            if (absSpeed < 1.0) return false;

            const vYaw = typeof vehicle.getYaw === 'function' ? vehicle.getYaw() : (vehicle.yaw || 0);
            const sign = rawSpd >= 0 ? 1 : -1;
            const fwdX = -Math.sin(vYaw) * sign;
            const fwdZ = -Math.cos(vYaw) * sign;

            // Forward launch speed & upward arc scale directly with how fast the car is going
            const forwardLaunchSpeed = Math.max(3.5, absSpeed * 1.35);
            const upwardLaunchSpeed = Math.min(14.0, 2.8 + absSpeed * 0.42);

            ped.state = 'ragdoll';
            ped.hp = 0;
            ped.impactSpeed = absSpeed;
            ped.ragdollOrigin = { x: ped.mesh.position.x, z: ped.mesh.position.z };
            ped.ragdollDisplacement = 0;
            ped.ragdollVel = new THREE.Vector3(
                fwdX * forwardLaunchSpeed,
                upwardLaunchSpeed,
                fwdZ * forwardLaunchSpeed
            );
            ped.ragdollAngVel = new THREE.Vector3(
                5.0 + absSpeed * 0.65,
                (ped.index % 2 === 0 ? 1 : -1) * (1.5 + absSpeed * 0.2),
                0
            );
            ped.mesh.position.y = Math.max(0.35, ped.mesh.position.y + 0.35);
            ped.mesh.rotation.y = Math.atan2(fwdX, fwdZ);
            return true;
        }

        function checkVehiclePedestrianImpacts() {
            const allCars = [playerVehicle, ...trafficVehicles];
            const hitRadius = 1.75;

            for (let c = 0, cLen = allCars.length; c < cLen; c++) {
                const car = allCars[c];
                if (!car) continue;
                const spd = Math.abs(typeof car.getSpeed === 'function' ? car.getSpeed() : (car.speed || 0));
                if (spd < 1.2) continue;

                const cx = car.position.x;
                const cz = car.position.z;

                for (let p = 0, pLen = pedestrians.length; p < pLen; p++) {
                    const ped = pedestrians[p];
                    if (!ped || ped.isDead || ped.state === 'ragdoll' || ped.state === 'carjacked') continue;

                    const dx = ped.mesh.position.x - cx;
                    const dz = ped.mesh.position.z - cz;
                    if (dx * dx + dz * dz <= hitRadius * hitRadius) {
                        hitPedestrianWithVehicle(ped, car);
                    }
                }
            }
        }

        function makeNearbyPedestriansFlee(shotOrigin) {
            for (let i = 0; i < pedestrians.length; i++) {
                const ped = pedestrians[i];
                if (ped.isDead) continue;
                const dx = ped.mesh.position.x - shotOrigin.x;
                const dz = ped.mesh.position.z - shotOrigin.z;
                const dist = Math.hypot(dx, dz);
                if (dist < 40 && dist > 0.01) {
                    ped.state = 'fleeing';
                    ped.speed = 0.18;
                    ped.fleeTimer = 240;
                    ped.velocity.set((dx / dist) * ped.speed, 0, (dz / dist) * ped.speed);
                }
            }
        }

        function updatePedestrians(dt = 1 / 60) {
            const stepScale = dt / (1 / 60);
            for (let i = 0; i < pedestrians.length; i++) {
                const ped = pedestrians[i];
                if (ped.state === 'ragdoll') {
                    // Integrate 3D ragdoll trajectory under gravity & air/ground drag
                    ped.mesh.position.x += ped.ragdollVel.x * dt;
                    ped.mesh.position.y += ped.ragdollVel.y * dt;
                    ped.mesh.position.z += ped.ragdollVel.z * dt;
                    ped.ragdollVel.y -= 24.0 * dt; // Gravity

                    // Tumble forward in the air
                    ped.mesh.rotation.x += ped.ragdollAngVel.x * dt;
                    ped.mesh.rotation.y += ped.ragdollAngVel.y * dt;

                    if (ped.ragdollOrigin) {
                        ped.ragdollDisplacement = Math.hypot(
                            ped.mesh.position.x - ped.ragdollOrigin.x,
                            ped.mesh.position.z - ped.ragdollOrigin.z
                        );
                    }

                    // Ground impact & skidding to rest
                    if (ped.mesh.position.y <= 0.25 && ped.ragdollVel.y <= 0) {
                        ped.mesh.position.y = 0.25;
                        const horizSpd = Math.hypot(ped.ragdollVel.x, ped.ragdollVel.z);
                        if (horizSpd > 3.5) {
                            // Skid forward along ground before stopping
                            ped.ragdollVel.y = Math.min(1.6, horizSpd * 0.12);
                            ped.ragdollVel.x *= 0.42;
                            ped.ragdollVel.z *= 0.42;
                            ped.ragdollAngVel.multiplyScalar(0.45);
                        } else {
                            ped.ragdollVel.set(0, 0, 0);
                            ped.mesh.rotation.x = Math.PI / 2;
                            ped.mesh.rotation.z = 0;
                            ped.isDead = true;
                            ped.state = 'dead';
                            createBloodPool(ped.mesh.position);
                        }
                    }
                    continue;
                }
                if (ped.isDead) continue;

                if (ped.state === 'talking') {
                    ped.talkTimer -= stepScale;
                    const dxP = myPosition.x - ped.mesh.position.x;
                    const dzP = myPosition.z - ped.mesh.position.z;
                    ped.mesh.rotation.y = Math.atan2(dxP, dzP);
                    if (ped.mesh.userData.leftLeg && ped.mesh.userData.rightLeg) {
                        ped.mesh.userData.leftLeg.rotation.x = 0;
                        ped.mesh.userData.rightLeg.rotation.x = 0;
                    }
                    if (ped.talkTimer <= 0 || Math.hypot(dxP, dzP) > 6.0) {
                        ped.state = 'walking';
                    }
                    continue;
                }

                if (ped.state === 'fleeing') {
                    ped.fleeTimer -= stepScale;
                    ped.mesh.position.x += ped.velocity.x * stepScale;
                    ped.mesh.position.z += ped.velocity.z * stepScale;
                    ped.mesh.rotation.y = Math.atan2(ped.velocity.x, ped.velocity.z);
                    if (ped.fleeTimer <= 0) {
                        ped.state = 'walking';
                        ped.speed = 0.06;
                    }
                } else {
                    const lane = roadNetwork.lanesById.get(ped.laneId);
                    if (lane && lane.waypoints.length > 0) {
                        const wp = lane.waypoints[ped.wpIndex];
                        const nx = -Math.sin(wp.yaw + Math.PI / 2);
                        const nz = -Math.cos(wp.yaw + Math.PI / 2);
                        const targetX = wp.x + nx * ped.sideOffset;
                        const targetZ = wp.z + nz * ped.sideOffset;

                        const dx = targetX - ped.mesh.position.x;
                        const dz = targetZ - ped.mesh.position.z;
                        const dist = Math.hypot(dx, dz);

                        if (dist < 1.5) {
                            ped.wpIndex = (ped.wpIndex + 1) % lane.waypoints.length;
                        } else {
                            const moveStep = ped.speed * stepScale;
                            ped.mesh.position.x += (dx / dist) * moveStep;
                            ped.mesh.position.z += (dz / dist) * moveStep;
                            ped.mesh.rotation.y = Math.atan2(dx, dz);
                        }
                    }
                }

                // Animate walking legs
                ped.walkPhase += (ped.state === 'fleeing' ? 0.28 : 0.12) * stepScale;
                const legSwing = Math.sin(ped.walkPhase) * 0.45;
                if (ped.mesh.userData.leftLeg && ped.mesh.userData.rightLeg) {
                    ped.mesh.userData.leftLeg.rotation.x = legSwing;
                    ped.mesh.userData.rightLeg.rotation.x = -legSwing;
                }
            }

            // Update pedestrian talk prompt & dialog timer
            const talkIndicatorEl = document.getElementById('ped-talk-indicator');
            const dialogEl = document.getElementById('ped-dialog');
            if (playerController && playerController.getState() === 'ON_FOOT') {
                const nearPed = getNearbyPedestrian(4.0);
                if (talkIndicatorEl) {
                    talkIndicatorEl.style.display = nearPed ? 'block' : 'none';
                }
            } else if (talkIndicatorEl) {
                talkIndicatorEl.style.display = 'none';
            }

            if (activeDialogTimer > 0) {
                activeDialogTimer -= stepScale;
                if (activeDialogTimer <= 0) {
                    activeDialog = null;
                    if (dialogEl) dialogEl.style.display = 'none';
                }
            }

            updateBloodPools();
        }

        // Spawn neighborhood pedestrians right away
        spawnPedestrians(24);

        // ============ PROJECTILES & SHOOTING MECHANICS ============
        const sharedBulletGeo = new THREE.SphereGeometry(0.08, 6, 6);
        const sharedBulletMat = new THREE.MeshBasicMaterial({ color: 0xffe600 });
        const sharedRocketGeo = new THREE.CylinderGeometry(0.08, 0.12, 0.5, 8);
        sharedRocketGeo.rotateX(Math.PI / 2);
        const sharedRocketMat = new THREE.MeshBasicMaterial({ color: 0xff4400 });

        function shootWeapon() {
            const weapon = weapons[currentWeaponIndex];
            if (!weapon || weapon.type !== 'gun') return { fired: false, reason: 'not_a_gun' };

            const now = performance.now();
            if (now - lastShotTime < weapon.fireRate) {
                return { fired: false, reason: 'cooldown' };
            }
            lastShotTime = now;
            totalShotCount++;

            // Play authentic gunshot sound from /media
            playGunSound(weapon.audioObj || gunFallbackSound, weapon.sound);

            // Apply recoil to viewmodel
            viewmodelRecoil = weapon.explosive ? 0.14 : 0.07;

            // Compute camera aim direction
            const aimDir = new THREE.Vector3();
            camera.getWorldDirection(aimDir);
            if (aimDir.lengthSq() < 0.001) {
                aimDir.set(-Math.sin(fpCameraYaw) * Math.cos(fpCameraPitch), Math.sin(fpCameraPitch), -Math.cos(fpCameraYaw) * Math.cos(fpCameraPitch)).normalize();
            }

            const muzzleOrigin = camera.position.clone().addScaledVector(aimDir, 0.6);
            makeNearbyPedestriansFlee(myPosition);

            let hitCount = 0;
            const pellets = weapon.pellets || 1;

            for (let p = 0; p < pellets; p++) {
                const dir = aimDir.clone();
                if (weapon.spread > 0 && p > 0) {
                    dir.x += (Math.random() - 0.5) * weapon.spread;
                    dir.y += (Math.random() - 0.5) * weapon.spread;
                    dir.z += (Math.random() - 0.5) * weapon.spread;
                    dir.normalize();
                }

                // Immediate hitscan check along aim ray against living pedestrians
                for (let i = 0; i < pedestrians.length; i++) {
                    const ped = pedestrians[i];
                    if (ped.isDead) continue;

                    const pedCenterX = ped.mesh.position.x;
                    const pedCenterY = ped.mesh.position.y + 1.0;
                    const pedCenterZ = ped.mesh.position.z;

                    const toPedX = pedCenterX - camera.position.x;
                    const toPedY = pedCenterY - camera.position.y;
                    const toPedZ = pedCenterZ - camera.position.z;

                    const proj = toPedX * dir.x + toPedY * dir.y + toPedZ * dir.z;
                    if (proj > 0 && proj <= weapon.range) {
                        const closestX = camera.position.x + dir.x * proj;
                        const closestY = camera.position.y + dir.y * proj;
                        const closestZ = camera.position.z + dir.z * proj;

                        const distHoriz = Math.hypot(pedCenterX - closestX, pedCenterZ - closestZ);
                        const distVert = Math.abs(pedCenterY - closestY);
                        const hitRadius = weapon.explosive ? 6.0 : 1.15;

                        if (distHoriz <= hitRadius && distVert <= (weapon.explosive ? 6.0 : 1.5)) {
                            ped.hp -= weapon.damage;
                            if (ped.hp <= 0) {
                                killPedestrian(ped);
                                hitCount++;
                            }
                            if (!weapon.explosive) break;
                        }
                    }
                }

                // Also spawn visible 3D projectile for visual feedback & moving targets
                const projMesh = new THREE.Mesh(
                    weapon.explosive ? sharedRocketGeo : sharedBulletGeo,
                    weapon.explosive ? sharedRocketMat : sharedBulletMat
                );
                projMesh.position.copy(muzzleOrigin);
                projMesh.lookAt(muzzleOrigin.clone().add(dir));
                scene.add(projMesh);

                projectiles.push({
                    mesh: projMesh,
                    velocity: dir.clone().multiplyScalar(weapon.projectileSpeed),
                    damage: weapon.damage,
                    explosive: !!weapon.explosive,
                    distanceTraveled: 0,
                    maxRange: weapon.range
                });
            }

            return {
                fired: true,
                weapon: weapon.name,
                sound: weapon.sound,
                hitCount,
                shotCount: totalShotCount
            };
        }

        function updateProjectiles(dt = 1 / 60) {
            const stepScale = dt / (1 / 60);
            for (let i = projectiles.length - 1; i >= 0; i--) {
                const proj = projectiles[i];
                const stepVec = proj.velocity.clone().multiplyScalar(stepScale);
                proj.mesh.position.add(stepVec);
                proj.distanceTraveled += stepVec.length();

                let hit = false;
                for (let j = 0; j < pedestrians.length; j++) {
                    const ped = pedestrians[j];
                    if (ped.isDead) continue;
                    const dx = proj.mesh.position.x - ped.mesh.position.x;
                    const dy = proj.mesh.position.y - (ped.mesh.position.y + 1.0);
                    const dz = proj.mesh.position.z - ped.mesh.position.z;
                    const hitDist = proj.explosive ? 5.0 : 1.1;
                    if (Math.hypot(dx, dz) < hitDist && Math.abs(dy) < 1.5) {
                        ped.hp -= proj.damage;
                        if (ped.hp <= 0) {
                            killPedestrian(ped);
                        }
                        hit = true;
                        if (!proj.explosive) break;
                    }
                }

                if (hit || proj.distanceTraveled >= proj.maxRange || proj.mesh.position.y < -1) {
                    scene.remove(proj.mesh);
                    projectiles.splice(i, 1);
                }
            }
        }

        // Spray particles in viewmodel
        const vmSprayParticles = [];

        function updateViewmodel() {
            if (!viewmodelScene || viewmodelMeshes.length === 0) return;

            const activeVM = viewmodelMeshes[currentWeaponIndex];
            if (!activeVM) return;

            const isMoving = fpKeys.w || fpKeys.a || fpKeys.s || fpKeys.d;
            if (isMoving) viewmodelBobTime += 0.12;

            const bobX = Math.sin(viewmodelBobTime) * 0.006;
            const bobY = Math.abs(Math.cos(viewmodelBobTime)) * 0.005;

            if (viewmodelRecoil > 0.001) {
                viewmodelRecoil *= 0.82;
            } else {
                viewmodelRecoil = 0;
            }

            if (currentWeaponIndex === 0 && viewmodelSprayCan) {
                viewmodelSprayCan.position.x = 0.2 + bobX;
                viewmodelSprayCan.position.y = -0.22 + bobY;

                if (isSpraying) {
                    viewmodelSprayCan.rotation.x = THREE.MathUtils.lerp(viewmodelSprayCan.rotation.x, -0.4, 0.2);
                    sprayParticleTime += 16;
                    if (sprayParticleTime > 40) {
                        sprayParticleTime = 0;
                        const particleGeo = new THREE.SphereGeometry(0.004, 4, 4);
                        const particleMat = new THREE.MeshBasicMaterial({
                            color: currentSprayColor,
                            transparent: true,
                            opacity: 0.7
                        });
                        const particle = new THREE.Mesh(particleGeo, particleMat);
                        particle.position.set(
                            viewmodelSprayCan.position.x + (Math.random() - 0.5) * 0.02,
                            viewmodelSprayCan.position.y + 0.12,
                            viewmodelSprayCan.position.z - 0.05
                        );
                        particle.userData.velocity = new THREE.Vector3(
                            (Math.random() - 0.5) * 0.003,
                            0.002,
                            -0.015
                        );
                        particle.userData.life = 0;
                        viewmodelScene.add(particle);
                        vmSprayParticles.push(particle);
                    }
                } else {
                    viewmodelSprayCan.rotation.x = THREE.MathUtils.lerp(viewmodelSprayCan.rotation.x, -0.1, 0.15);
                }
            } else {
                activeVM.position.x = 0.21 + bobX;
                activeVM.position.y = -0.21 + bobY;
                activeVM.position.z = -0.36 + viewmodelRecoil;
                activeVM.rotation.x = viewmodelRecoil * 1.6;
            }

            // Update spray particles
            for (let i = vmSprayParticles.length - 1; i >= 0; i--) {
                const p = vmSprayParticles[i];
                p.position.add(p.userData.velocity);
                p.userData.life++;
                p.material.opacity -= 0.06;
                if (p.material.opacity <= 0 || p.userData.life > 15) {
                    viewmodelScene.remove(p);
                    p.geometry.dispose();
                    p.material.dispose();
                    vmSprayParticles.splice(i, 1);
                }
            }
        }
        
        // ============ COLOR PICKER UI ============
        const colorPickerEl = document.getElementById('color-picker');

        function buildColorPicker() {
            colorPickerEl.innerHTML = '';

                swatch.className = 'color-swatch' + (color === currentSprayColor ? ' active' : '');
                swatch.style.backgroundColor = '#' + color.toString(16).padStart(6, '0');

                    e.stopPropagation();

                    document.querySelectorAll('.color-swatch').forEach(s => s.classList.remove('active'));
                    swatch.classList.add('active');

        function updateSprayCanColor() {
            if (!viewmodelSprayCan) return;
            // Update the label band color on the can
            const label = viewmodelSprayCan.children[3]; // label band
            if (label && label.material) {
                label.material.color.setHex(currentSprayColor);
            }
        }
        
        function toggleColorPicker() {
            colorPickerVisible = !colorPickerVisible;
            colorPickerEl.style.display = colorPickerVisible ? 'flex' : 'none';
        }
        
        // ============ COLLISION (fast SpatialGrid broadphase) ============
        const _playerBox = new THREE.Box3();
        const _playerHalfSize = new THREE.Vector3(playerRadius, 0.9, playerRadius);
        const _playerScratch = [];
        
        function checkCollision(newPosition) {
            // Build player AABB centered on newPosition
            _playerBox.min.set(
                newPosition.x - playerRadius,
                newPosition.y + 0.1,
                newPosition.z - playerRadius
            );
            _playerBox.max.set(
                newPosition.x + playerRadius,
                newPosition.y + 1.8,
                newPosition.z + playerRadius
            );
            
            // Fast O(1) query against spatial hash grid static obstacles
            spatialGrid.queryRadius(newPosition.x, newPosition.z, playerRadius + 2.0, _playerScratch, 'STATIC');
            for (let i = 0, len = _playerScratch.length; i < len; i++) {
                const box = _playerScratch[i].box;
                if (box && _playerBox.intersectsBox(box)) return true;
            }
            return false;
        }
        
        // ============ DEV FLY MODE ============
        let devMode = false;
        const devFlySpeed = 1.5;
        const devFlySprintSpeed = 5.0;
        const devFlyKeys = { w: false, a: false, s: false, d: false, space: false, shift: false, sprint: false };
        const devCamPos = new THREE.Vector3(0, 50, 0);
        
        function updateDevFlyCamera() {
            const speed = devFlyKeys.sprint ? devFlySprintSpeed : devFlySpeed;
            const forward = new THREE.Vector3(
                -Math.sin(fpCameraYaw) * Math.cos(fpCameraPitch),
                Math.sin(fpCameraPitch),
                -Math.cos(fpCameraYaw) * Math.cos(fpCameraPitch)
            );
            const right = new THREE.Vector3(Math.cos(fpCameraYaw), 0, -Math.sin(fpCameraYaw));
            
            if (devFlyKeys.w) devCamPos.add(forward.clone().multiplyScalar(speed));
            if (devFlyKeys.s) devCamPos.add(forward.clone().multiplyScalar(-speed));
            if (devFlyKeys.a) devCamPos.add(right.clone().multiplyScalar(-speed));
            if (devFlyKeys.d) devCamPos.add(right.clone().multiplyScalar(speed));
            if (devFlyKeys.space) devCamPos.y += speed;
            if (devFlyKeys.shift) devCamPos.y -= speed;
            
            camera.position.copy(devCamPos);
            camera.rotation.order = 'YXZ';
            camera.rotation.y = fpCameraYaw;
            camera.rotation.x = fpCameraPitch;
            camera.rotation.z = 0;
            
            const hud = document.getElementById('dev-hud');
            hud.textContent = `DEV FLY MODE | X:${devCamPos.x.toFixed(1)} Y:${devCamPos.y.toFixed(1)} Z:${devCamPos.z.toFixed(1)}\nWASD + Space/Shift | Ctrl = Sprint | F12 = Exit`;
        }
        
        // ============ PLAYER MOVEMENT (Zero-allocation scratch vectors) ============
        const _pForward = new THREE.Vector3();
        const _pRight = new THREE.Vector3();
        const _pNewPos = new THREE.Vector3();
        const _pNewPosX = new THREE.Vector3();
        const _pNewPosZ = new THREE.Vector3();
        const _pCameraForward = new THREE.Vector3();
        const _pCameraRight = new THREE.Vector3();
        const _pCameraTarget = new THREE.Vector3();
        let _lastCoordsUpdate = 0;
        
        function updatePlayer(dt = 1 / 60) {
            if (!gameStarted) return;
            if (playerController && playerController.getState() === 'IN_VEHICLE') return;
            
            _pForward.set(-Math.sin(fpCameraYaw), 0, -Math.cos(fpCameraYaw));
            _pRight.set(Math.cos(fpCameraYaw), 0, -Math.sin(fpCameraYaw));
            const isRunning = !!(fpKeys.shift || (playerController && playerController.keys && playerController.keys.shift));
            const baseMoveSpeed = isRunning ? fpRunSpeed : fpMoveSpeed;
            const stepMoveSpeed = baseMoveSpeed * (dt / (1 / 60));
            
            _pNewPos.copy(myPosition);
            if (fpKeys.w) _pNewPos.addScaledVector(_pForward, stepMoveSpeed);
            if (fpKeys.s) _pNewPos.addScaledVector(_pForward, -stepMoveSpeed);
            if (fpKeys.a) _pNewPos.addScaledVector(_pRight, -stepMoveSpeed);
            if (fpKeys.d) _pNewPos.addScaledVector(_pRight, stepMoveSpeed);
            
            if (!checkCollision(_pNewPos)) {
                myPosition.copy(_pNewPos);
            } else {
                // Wall sliding
                _pNewPosX.copy(myPosition);
                _pNewPosZ.copy(myPosition);
                
                if (fpKeys.w || fpKeys.s) {
                    const fwd = fpKeys.w ? stepMoveSpeed : -stepMoveSpeed;
                    _pNewPosX.x += _pForward.x * fwd;
                    _pNewPosZ.z += _pForward.z * fwd;
                }
                if (fpKeys.a || fpKeys.d) {
                    const side = fpKeys.d ? stepMoveSpeed : -stepMoveSpeed;
                    _pNewPosX.x += _pRight.x * side;
                    _pNewPosZ.z += _pRight.z * side;
                }
                
                if (!checkCollision(_pNewPosX)) myPosition.x = _pNewPosX.x;
                if (!checkCollision(_pNewPosZ)) myPosition.z = _pNewPosZ.z;
            }

            // Alternating SpongeBob footstep sounds (spongebobwalk1.mp3 & spongebobwalk2.mp3), speeding up when running
            const isMovingOnFoot = !!(fpKeys.w || fpKeys.a || fpKeys.s || fpKeys.d);
            if (isMovingOnFoot) {
                const targetInterval = isRunning ? footstepRunInterval : footstepWalkInterval;
                if (footstepElapsed === 0) {
                    playFootstepSound(isRunning);
                }
                footstepElapsed += dt;
                while (footstepElapsed >= targetInterval) {
                    footstepElapsed -= targetInterval;
                    playFootstepSound(isRunning);
                }
            } else {
                footstepElapsed = 0;
            }
            
            // Camera at eye level
            camera.position.set(myPosition.x, myPosition.y + 1.7, myPosition.z);
            _pCameraForward.set(-Math.sin(fpCameraYaw), 0, -Math.cos(fpCameraYaw));
            _pCameraRight.set(Math.cos(fpCameraYaw), 0, -Math.sin(fpCameraYaw));
            _pCameraForward.applyAxisAngle(_pCameraRight, fpCameraPitch);
            _pCameraTarget.copy(camera.position).addScaledVector(_pCameraForward, 10);
            camera.lookAt(_pCameraTarget);
            
            // Spray or automatic gun fire while holding mouse
            if (currentWeaponIndex === 0) {
                if (isSpraying) sprayAtTarget();
            } else if (isFiringGun && weapons[currentWeaponIndex] && weapons[currentWeaponIndex].automatic) {
                shootWeapon();
            }
            
            // Throttled coordinates display (skip DOM manipulation during fast simulations)
            const now = performance.now();
            if (now - _lastCoordsUpdate > 100) {
                _lastCoordsUpdate = now;
                const coordsDiv = document.getElementById('coords');
                if (coordsDiv) {
                    coordsDiv.innerHTML = `X: ${myPosition.x.toFixed(2)}<br>Y: ${myPosition.y.toFixed(2)}<br>Z: ${myPosition.z.toFixed(2)}`;
                }
            }
        }
        
        // ============ INPUT ============
        // Join game
        const nameInput = document.getElementById('name-input');
        const joinBtn = document.getElementById('join-btn');
        const playerNameInput = document.getElementById('player-name');
        
        joinBtn.addEventListener('click', () => {

        playerNameInput.addEventListener('keypress', (e) => {

        // Pointer lock
        renderer.domElement.addEventListener('click', () => {

        // Mouse look
        document.addEventListener('mousemove', (event) => {

                fpCameraYaw -= event.movementX * fpMouseSensitivity;
                fpCameraPitch -= event.movementY * fpMouseSensitivity;
                fpCameraPitch = Math.max(-fpMaxPitch, Math.min(fpMaxPitch, fpCameraPitch));

            } else {

        }, { passive: false });
        
        // Keyboard
        document.addEventListener('keydown', (event) => {
            // F12 toggles dev fly mode
            if (event.key === 'F12') {
                event.preventDefault();

                } else {
