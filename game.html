                    devFlyKeys.w = devFlyKeys.a = devFlyKeys.s = devFlyKeys.d = false;
                    devFlyKeys.space = devFlyKeys.shift = devFlyKeys.sprint = false;
                }
                return;
            }
            
            if (devMode) {
                switch(event.key.toLowerCase()) {
                    case 'w': devFlyKeys.w = true; break;
                    case 'a': devFlyKeys.a = true; break;
                    case 's': devFlyKeys.s = true; break;
                    case 'd': devFlyKeys.d = true; break;
                    case ' ': devFlyKeys.space = true; event.preventDefault(); break;
                    case 'control': devFlyKeys.sprint = true; break;
                }
                if (event.key === 'Shift') devFlyKeys.shift = true;
                return;
            }
            
            if (!gameStarted) return;
            
            const keyLower = event.key.toLowerCase();
            if (event.key === 'Shift' || keyLower === 'shift') {
                fpKeys.shift = true;
                playerController.keys.shift = true;
                return;
            }
            if (keyLower === 'e') {
                if (playerController.getState() === 'ON_FOOT') {
                    const nearPed = getNearbyPedestrian(4.0);
                    const nearCar = playerController.getNearbyVehicle([playerVehicle, ...trafficVehicles]);
                    if (nearPed && (!nearCar || Math.hypot(nearPed.mesh.position.x - myPosition.x, nearPed.mesh.position.z - myPosition.z) <= Math.hypot(nearCar.position.x - myPosition.x, nearCar.position.z - myPosition.z))) {
                        talkToNearbyPedestrian();

                        tryBoardOrJackVehicle();
                    }
                } else {
                    const exited = playerController.exitVehicle(spatialGrid);
                    if (exited) {
                        handleExitVehicleRadio();
                        myPosition.copy(playerController.position);
                        camera.position.set(playerController.position.x, playerController.position.y + 1.7, playerController.position.z);
                    }
                }
                return;
            }

            // Weapon selection keys 1..5 and Q to cycle
            if (event.key >= '1' && event.key <= '5') {
                selectWeapon(parseInt(event.key, 10) - 1);
                return;
            }
            if (keyLower === 'q') {
                selectWeapon((currentWeaponIndex + 1) % weapons.length);
                return;
            }

            switch(keyLower) {
                case 'w':
                    fpKeys.w = true;
                    playerController.keys.w = true;
                    break;
                case 'a':
                    fpKeys.a = true;
                    playerController.keys.a = true;
                    break;
                case 's':
                    fpKeys.s = true;
                    playerController.keys.s = true;
                    break;
                case 'd':
                    fpKeys.d = true;
                    playerController.keys.d = true;
                    break;
                case ' ':

                        playerController.keys.space = true;
                    }

                case 'c': toggleColorPicker(); break;
                case 'v': toggleMode(); break;
                case 'r':

                        toggleRadioPause();
                    }
                    break;
                case 'n':
                    if (playerController.getState() === 'IN_VEHICLE') {
                        skipRadioTrack();
                    }
                    break;
            }
        });
        
        document.addEventListener('keyup', (event) => {
            if (devMode) {
                switch(event.key.toLowerCase()) {

                    case 'a': devFlyKeys.a = false; break;
                    case 's': devFlyKeys.s = false; break;
                    case 'd': devFlyKeys.d = false; break;
                    case ' ': devFlyKeys.space = false; break;
                    case 'control': devFlyKeys.sprint = false; break;
                }
                if (event.key === 'Shift') devFlyKeys.shift = false;
                return;
            }
            
            const keyLower = event.key.toLowerCase();
            if (event.key === 'Shift' || keyLower === 'shift') {
                fpKeys.shift = false;
                playerController.keys.shift = false;
                return;
            }
            switch(keyLower) {
                case 'w':
                    fpKeys.w = false;
                    playerController.keys.w = false;
                    break;
                case 'a':
                    fpKeys.a = false;
                    playerController.keys.a = false;
                    break;
                case 's':
                    fpKeys.s = false;
                    playerController.keys.s = false;
                    break;
                case 'd':
                    fpKeys.d = false;
                    playerController.keys.d = false;
                    break;
                case ' ':
                    playerController.keys.space = false;
                    break;
            }
        });
        
        // ============ /ANOTHERMAPO 3D MAP LOADER (NO PROCEDURAL MAP) ============
        const loadingDiv = document.getElementById('loading');
        
        // Insert perimeter boundary walls into spatial grid at +-280m
        spatialGrid.insertStatic('wall_n', { min: { x: -300, y: 0, z: 280 }, max: { x: 300, y: 5, z: 300 } });
        spatialGrid.insertStatic('wall_s', { min: { x: -300, y: 0, z: -300 }, max: { x: 300, y: 5, z: -280 } });
        spatialGrid.insertStatic('wall_e', { min: { x: 280, y: 0, z: -300 }, max: { x: 300, y: 5, z: 300 } });
        spatialGrid.insertStatic('wall_w', { min: { x: -300, y: 0, z: -300 }, max: { x: -280, y: 5, z: 300 } });
        
        // Build flat list of meshes for spray raycasting
        function buildSprayTargets() {
            sprayTargetMeshes = [];
            if (anothermapoLoader && anothermapoLoader.mapRoot) {
                anothermapoLoader.mapRoot.traverse((child) => {
                    if (child.isMesh) sprayTargetMeshes.push(child);
                });
            }
        }

        const mapState = {
            isLoaded: false,
            parts: [],
            loadedPartsCount: 0,
            obstacleCount: 0,
            totalTriangles: 0
        };
        const anothermapoLoader = new AnothermapoLoader({
            basePath: '/anothermapo/',
            startPart: 0,
            endPart: 8,
            batchSize: 6,
            roadNetwork,
            collisionMeshes
        });
        anothermapoLoader.load(scene, spatialGrid, (progress) => {

            }
        });
        
        // ============ VIEWMODEL INIT ============
        initViewmodelScene();
        updateWeaponHUD();
        
        // ============ MOBILE CONTROLS ============
        const isMobile = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
        const mobileControls = document.getElementById('mobile-controls');
        const mobileJoystick = document.getElementById('mobile-joystick');
        const mobileJoystickThumb = document.getElementById('mobile-joystick-thumb');
        const mobileLook = document.getElementById('mobile-look');
        const mobileSprayBtn = document.getElementById('mobile-spray-btn');
        const mobileModeBtn = document.getElementById('mobile-mode-btn');
        const mobileUploadBtn = document.getElementById('mobile-upload-btn');
        const mobileColorBtn = document.getElementById('mobile-color-btn');
        
        let joystickTouchId = null;
        let joystickCenterX = 0, joystickCenterY = 0;
        let joystickDx = 0, joystickDy = 0;
        let lookTouchId = null;
        let lookLastX = 0, lookLastY = 0;
        const mobileLookSensitivity = 0.004;
        
        function showMobileControls() {

                mobileControls.style.display = 'block';
            }
        }
        
        // Joystick touch handlers
        mobileJoystick.addEventListener('touchstart', (e) => {
            e.preventDefault();
            const touch = e.changedTouches[0];
            joystickTouchId = touch.identifier;
            const rect = mobileJoystick.getBoundingClientRect();
            joystickCenterX = rect.left + rect.width / 2;
            joystickCenterY = rect.top + rect.height / 2;
        }, { passive: false });
        
        mobileJoystick.addEventListener('touchmove', (e) => {
            e.preventDefault();
            for (const touch of e.changedTouches) {
                if (touch.identifier === joystickTouchId) {
                    const maxDist = 50;
                    let dx = touch.clientX - joystickCenterX;
                    let dy = touch.clientY - joystickCenterY;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist > maxDist) { dx = dx / dist * maxDist; dy = dy / dist * maxDist; }
                    joystickDx = dx / maxDist;
                    joystickDy = dy / maxDist;
                    mobileJoystickThumb.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
                }
            }
        }, { passive: false });
        
        function resetJoystick() {

            joystickDx = 0;

            for (const touch of e.changedTouches) {
                if (touch.identifier === joystickTouchId) resetJoystick();

                    lookLastY = touch.clientY;

        // Update movement from joystick each frame
        function updateMobileJoystick() {
            if (!isMobile || joystickTouchId === null) return;
            const deadzone = 0.15;
            fpKeys.w = joystickDy < -deadzone;
            fpKeys.s = joystickDy > deadzone;

            fpKeys.d = joystickDx > deadzone;

        // ============ FIXED 60HZ TIMESTEP SIMULATION & GAME LOOP ============
        const FIXED_DELTA = CONFIG.SIMULATION.FIXED_DELTA;
        const MAX_SUB_STEPS = CONFIG.SIMULATION.MAX_SUB_STEPS;
        const FRAME_TIME_CLAMP = CONFIG.SIMULATION.FRAME_TIME_CLAMP;
        let lastFrameTime = performance.now();
        let accumulator = 0;

        const _playerEntity = { id: 'player', position: myPosition, radius: playerRadius };
        let previousPlayerState = 'ON_FOOT';

        /**
         * Fixed-rate physics and simulation update
         * @param {number} dt Constant timestep in seconds (1/60)
         */
        function stepSimulation(dt = FIXED_DELTA) {
            updateMobileJoystick();
            
            if (devMode) {
                updateDevFlyCamera();
                updateCarAudio(null, false);
            } else if (carjackState.active) {
                updateCarjackAnimation(dt);
                updateCarAudio(carjackState.vehicle, false);
                previousPlayerState = 'ON_FOOT';
            } else {
                const currentState = playerController.getState();
                if (currentState === 'IN_VEHICLE') {
                    if (!radioState.isInCar) {
                        handleEnterVehicleRadio();
                    }
                    const activeV = playerController.getVehicle() || playerVehicle;
                    playerController.update(dt, spatialGrid, roadNetwork);
                    activeV.update(dt, spatialGrid);
                    myPosition.set(activeV.position.x, activeV.position.y, activeV.position.z);
                    cameraController.update(dt, myPosition);
                    updateCivicHUD(activeV, false, true);
                    updateCarAudio(activeV, true);
                } else {
                    if (radioState.isInCar) {
                        handleExitVehicleRadio();
                    }
                    // Synchronize myPosition and camera when disembarking or if playerController relocated
                    if (previousPlayerState === 'IN_VEHICLE' || playerController.position.distanceTo(myPosition) > 0.05) {
                        myPosition.copy(playerController.position);
                        camera.position.set(myPosition.x, myPosition.y + 1.7, myPosition.z);
                    }
                    updatePlayer(dt);
                    playerController.position.copy(myPosition);
                    playerController.update(dt, spatialGrid, roadNetwork);
                    cameraController.update(dt, myPosition);
                    updateCarAudio(null, false);
                }
                previousPlayerState = currentState;
            }

            // Update sky dome, sun position, and directional shadow frustum to follow player
            skyDomeMesh.position.set(myPosition.x, 0, myPosition.z);
            sunSkyGroup.position.set(
                myPosition.x + sunDirection.x * 1400,
                sunDirection.y * 1400,
                myPosition.z + sunDirection.z * 1400
            );
            sunLight.position.set(myPosition.x + 80, 180, myPosition.z + 60);
            sunLight.target.position.set(myPosition.x, 0, myPosition.z);

            // Update 12 autonomous AI traffic fleet (Pure Pursuit + IDM + Anti-Overlap + InstancedMesh)
            trafficManager.update(dt, playerController.getVehicle() || playerVehicle);

            // Check vehicle-pedestrian impacts (ragdoll launch scaled by car speed) & update pedestrians/projectiles
            checkVehiclePedestrianImpacts();
            updatePedestrians(dt);
            updateProjectiles(dt);

            // Sync dynamic entities into spatial grid (zero-allocation)
            spatialGrid.clearDynamic();
            if (playerController.getState() === 'ON_FOOT') {
                spatialGrid.insertDynamic('player', myPosition.x, myPosition.z, playerRadius, _playerEntity);
            }
            spatialGrid.insertDynamic(playerVehicle.id, playerVehicle.position.x, playerVehicle.position.z, playerVehicle.radius, playerVehicle);
            for (let i = 0, len = trafficVehicles.length; i < len; i++) {
                const tv = trafficVehicles[i];
                spatialGrid.insertDynamic(tv.id, tv.position.x, tv.position.z, tv.radius, tv);
            }
        }

        /**
         * Variable-rate visual and rendering update
         */
        function renderFrame() {
            sunHaloMesh.lookAt(camera.position);
            updateViewmodel();
            
            renderer.render(scene, camera);
            
            // Render viewmodel on top (only on foot)
            if (gameStarted && viewmodelScene && viewmodelCamera && !devMode && playerController.getState() === 'ON_FOOT') {
                renderer.autoClear = false;
                renderer.clearDepth();
                renderer.render(viewmodelScene, viewmodelCamera);
                renderer.autoClear = true;
            }
        }

        /**
         * Main requestAnimationFrame loop driven by 60Hz accumulator
         */
        function animate(currentTime = performance.now()) {
            requestAnimationFrame(animate);
            
            if (window.__GAME__ && window.__GAME__.simulation && window.__GAME__.simulation.isPaused()) {
                renderFrame();
                return;
            }

            let frameTime = (currentTime - lastFrameTime) / 1000;
            lastFrameTime = currentTime;
            
            if (frameTime > FRAME_TIME_CLAMP) {
                frameTime = FRAME_TIME_CLAMP;
            }
            
            accumulator += frameTime;
            
            let subSteps = 0;
            while (accumulator >= FIXED_DELTA && subSteps < MAX_SUB_STEPS) {
                stepSimulation(FIXED_DELTA);
                accumulator -= FIXED_DELTA;
                subSteps++;
            }
            
            if (accumulator >= FIXED_DELTA && subSteps >= MAX_SUB_STEPS) {
                accumulator = 0;
            }
            
            renderFrame();
        }

        // ============ INITIALIZE AUTOMATION TESTING API ============
        initGameAPI({
            scene,
            camera,
            renderer,
            playerPosition: myPosition,
            playerKeys: fpKeys,
            stepSimulation,
            renderFrame,
            playerController,
            playerVehicle,
            trafficManager,
            trafficVehicles,
            mapState,
            hasVehicles: true,
            spatialGrid,
            pedestrians,
            bloodPools,
            weapons,
            selectWeapon,
            shootWeapon,
            talkToNearbyPedestrian,
            getNearbyPedestrian,
            getActiveDialog: () => activeDialog,
            getFootstepHistory: () => footstepHistory,
            tryBoardOrJackVehicle,
            startCarjackAnimation,
            getCarjackState: () => carjackState,
            getCarAudioState: () => carAudioState,
            getBackgroundMusicState: () => ({
                src: '/media/music.mp3',
                loop: backgroundMusic.loop,
                volume: backgroundMusic.volume,
                paused: !isBackgroundMusicActive,
                active: isBackgroundMusicActive,
                audioElement: backgroundMusic
            }),
            getRadioState: () => getRadioState(),
            radioSkipTrack: () => skipRadioTrack(),
            radioRestartTrack: () => restartRadioTrack(),
            radioTogglePause: () => toggleRadioPause(),
            radioSetVolume: (v) => setRadioVolume(v),
            handleEnterVehicleRadio,
            handleExitVehicleRadio,
            hitPedestrianWithVehicle,
            getCurrentWeapon: () => weapons[currentWeaponIndex],
            getLastPlayedSound: () => lastPlayedSound,
            getShotCount: () => totalShotCount
        });

        // Ensure player simulation is active for headless test execution
        gameStarted = true;
        
        animate();
    </script>
</body>
